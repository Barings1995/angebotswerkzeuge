<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MediaSheet &ndash; Preis- und Terminblatt</title>
<meta name="theme-color" content="#00285A">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------------------
   MediaSheet — Preis- und Terminblatt je Titel

   Die vier uebrigen Werkzeuge rechnen; dieses gibt aus. Was hier entsteht, ist
   ein Blatt zum Weitergeben: an die Dispo, und vor Erscheinen der Mediadaten
   auch an Agenturen und einzelne Kunden. Der Excel-Abzug aus der Datenpflege
   taugt dafuer nicht — er ist als Rueckweg in die Datenpflege gebaut und
   enthaelt alle Titel und alle Jahrgaenge.

   Gelesen wird aus derselben Datenbank wie in OpenSlots und PreisWerk, ohne
   Anmeldung. Geschrieben wird nirgends.

   Optik und Bedienung folgen den vier uebrigen Werkzeugen: derselbe
   Hero-Streifen im Kopf, dieselbe Datenleiste darunter, dieselben Knoepfe,
   Felder, Schalter und Farbwerte. Uebernommen sind die Werte, nicht bloss die
   Absicht — die Regeln unten nennen jeweils die Stelle, von der sie stammen.
   --------------------------------------------------------------------------- */
:root{
  /* Springer Medizin · Brand Hub — Wert fuer Wert wie in OpenSlots, MediaQuote,
     PreisWerk und der Datenpflege: Navy primaer, Orange als einziger Akzent,
     die Neutralen kuehl aus dem Navy abgeleitet. MediaSheet fuehrte davor eigene,
     um Haaresbreite abweichende Toene — Text #1c2530 statt #1a2340, Rand #d8dde5
     statt #d6dbe8, Grau #5b6673 statt #6b7a99. Nebeneinander geoeffnet fiel das
     auf, ohne dass man haette sagen koennen, woran. */
  --navy:#00285a;            /* primaer: Kopf, Knoepfe, Auswahl, Ueberschriften */
  --navy-hover:#003a80;      /* Knopf beim Ueberfahren */
  --blue:#0176c3;            /* Springer-Blau · Verweise in der Formatliste */
  --blue-light:#b3dcf5;      /* Fokusschein im Ansprechpartner-Feld */
  --orange:#ee7d11;          /* einziger Akzent */
  --orange-dark:#c0630a;
  --orange-light:#fef3e8;    /* warme Toenung, wie --sm-orange-l in OpenSlots */
  --white:#ffffff;
  --surface:#eaeef4;         /* kuehle helle Flaeche: Gruppenzeilen, Hinweis */
  --surface-hover:#f4f6fa;
  --text:#1a2340;
  --grey-600:#6b7a99;        /* Sekundaertext */
  --grey-500:#9aa3b8;        /* Tertiaer, Platzhalter, gesperrte Schrift */
  --border:#d6dbe8;
  --bg:#f4f6fa;
  --shadow-sm:0 1px 3px rgba(0,40,90,.08);
  --shadow-md:0 2px 8px rgba(0,40,90,.10);
  /* Eckenradien als Staffel statt gestreuter Einzelwerte, wie in PreisWerk und
     der Datenpflege: sm = Felder und Kennzeichen, md = Knoepfe und Leisten,
     lg = Karten, xl bleibt fuer Fenster frei. */
  --radius-sm:4px; --radius-md:6px; --radius-lg:8px; --radius-xl:10px;
  --font-body:'Source Sans 3',system-ui,Arial,Helvetica,sans-serif;
  --font-title:'Playfair Display',Georgia,'Times New Roman',serif;
  /* Haarlinie zwischen den Zeilen des Blattes. Heller als --border, damit die
     Preisliste auf dem Papier nicht als Gitter erscheint. */
  --linie:#eef1f6;
}
*, *::before, *::after{box-sizing:border-box; margin:0; padding:0}
[hidden]{display:none!important}
/* Bedienfelder erben die Schrift nicht von selbst - Knoepfe, Eingabe- und
   Auswahlfelder bekommen sie vom Browser, wenn die Datei schweigt, und das ist
   Arial. Diese Regel laesst jedes Feld die Schrift seiner Umgebung uebernehmen;
   wo eine Klasse eine eigene Schrift setzt, behaelt sie Vorrang. Sie steht in
   allen fuenf Werkzeugen - die Luecke soll nicht wiederkehren. */
button, input, select, textarea{font-family:inherit}
/* Farben auch dann drucken, wenn der Browser Hintergruende von Haus aus
   weglaesst: sonst verlieren die Gruppenzeilen und der Vermerk „vorlaeufig" im
   PDF ihre Flaeche. Dieselbe Zeile steht in MediaQuote. */
*{-webkit-print-color-adjust:exact!important; print-color-adjust:exact!important}
html{background:var(--bg)}
body{
  font-family:var(--font-body); background:var(--bg); color:var(--text);
  font-size:14px; line-height:1.5;
}
/* Sichtbarer Fokus-Ring fuer die Tastatur, wie in PreisWerk. Nur fuer Knoepfe
   und Verweise: bei Auswahlfeldern zieht der Browser :focus-visible auch beim
   Mausklick heran, der Ring stuende dort also bei jedem Anklicken. Diese Felder
   zeigen den Fokus stattdessen dezent ueber :focus. */
a:focus-visible, button:focus-visible, label:focus-visible, [tabindex]:focus-visible{
  outline:2px solid var(--navy); outline-offset:2px; border-radius:var(--radius-sm);
}

/* ── Kopfleiste (Hero-Streifen) ───────────────────────────────────────────
   Zeichengleich mit den vier uebrigen Werkzeugen, samt der beiden festen
   Zeilenhoehen: MediaSheet fuehrt im body ein line-height von 1.5, OpenSlots
   und MediaQuote nicht — ohne die festen Werte waere die Leiste hier um einen
   halben Pixel hoeher als dort. */
.sm-hero{
  background:linear-gradient(135deg,#002050 0%,var(--navy) 60%,#004080 100%);
  padding:1.1rem 0 1rem; border-bottom:3px solid var(--orange);
}
.sm-hero-inner{padding:0 1.5rem}
.sm-hero-head{display:flex; flex-wrap:wrap; align-items:center; gap:1rem; margin-bottom:8px}
.sm-hero-head svg{flex:none}
.sm-hero-div{width:1px; align-self:stretch; background:rgba(255,255,255,.28); flex:none}
.sm-hero h1{
  font-family:var(--font-title); font-size:25px; font-weight:700; color:#fff;
  line-height:1.2; margin-bottom:2px; letter-spacing:-.01em;
}
.sm-hero h1 .sm-hero-mark{color:var(--orange)}
.sm-hero-sub{
  line-height:17.5px; font-size:12px; font-weight:600; color:rgba(255,255,255,.72);
  letter-spacing:.16em; text-transform:uppercase;
}
.sm-hero p{font-size:12.5px; color:rgba(255,255,255,.72); line-height:1.4; text-wrap:pretty}
.sm-hero p strong{color:rgba(255,255,255,.9); font-weight:600}
/* Rueckweg zur Startseite: weisser Rand auf Blau, gefuellt erst beim
   Ueberfahren. 16,5 px ist der Wert, den „normal" bei Source Sans 3 in 11,5 px
   ergibt — damit ist der Knopf hier so hoch wie in den uebrigen Werkzeugen. */
.hero-zurueck{
  margin-left:auto; display:inline-flex; align-items:center; gap:6px;
  background:none; border:1px solid rgba(255,255,255,.35); color:#fff;
  border-radius:var(--radius-md); font-size:11.5px; line-height:16.5px; font-weight:600;
  padding:5px 11px; text-decoration:none; white-space:nowrap; flex:none;
}
.hero-zurueck:hover{background:rgba(255,255,255,.12)}

/* ── Datenleiste ──────────────────────────────────────────────────────────
   Flaeche, Rundung und Polster der Datenleiste aus OpenSlots, MediaQuote und
   PreisWerk: weiss, 6 px rund, 7/12 gepolstert, dezenter Schatten. Sie steuert
   das Werkzeug und gehoert nicht zum Blatt — deshalb steht sie nicht in dessen
   Spalte, sondern mit 24 px Rand ueber die volle Fensterbreite, buendig zum
   Text der Kopfleiste (.sm-hero-inner: 0 1.5rem). */
.leiste{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--white);
  border:1px solid var(--border); border-radius:var(--radius-md); padding:7px 12px;
  margin:16px 24px 0; box-shadow:var(--shadow-sm);
}
/* Titel und Jahrgang: Beschriftung daneben, nicht darueber — dieselbe Bauform
   wie .data-yr/.year-sel in OpenSlots und .data-year in PreisWerk. Nativer
   Auswahlpfeil, kein selbst gezeichneter: so sehen die Felder aus wie die der
   uebrigen Werkzeuge, und wie die des Rechners. */
.feld{
  font-size:11.5px; color:var(--grey-600); font-weight:600;
  display:inline-flex; align-items:center; gap:5px;
}
.feld label{cursor:pointer}
.feld select{
  font-size:12px; font-weight:600; padding:4px 7px; border:1.5px solid var(--border);
  border-radius:var(--radius-md); background-color:var(--white); color:var(--text);
  cursor:pointer; appearance:auto; -webkit-appearance:auto;
}
select:focus{outline:none; border-color:var(--navy); box-shadow:0 0 0 2px rgba(0,40,90,.08)}
select:disabled{opacity:.5; cursor:not-allowed}

/* Wahlschalter mit drei Stellungen, immer genau eine aktiv. Bauform wie die
   Reiter der Datenpflege: weisse Huelle, innen gerundete Knoepfe, der aktive
   gefuellt. Nur flacher — 27 px statt 36 px innen: mit der eigenen Kante
   ergibt das 29 px, und damit laufen die Aussenkanten mit den Auswahlfeldern und
   den Knoepfen der Leiste auf einer Linie (gemessen). Die Datenpflege fuehrt
   eine Leiste mit 38 px hohen Feldern, deshalb dort 36. Der Schatten liegt 1 px ueber dem
   gefuellten Knopf und wandert beim Absetzen mit ihm nach unten, sonst blitzt
   dort der helle Grund auf. */
.umfang{
  display:inline-flex; border:1px solid var(--border); border-radius:var(--radius-md);
  overflow:hidden; background:var(--white);
}
.umfang button{
  border:none; background:var(--white); font-size:12px; font-weight:600;
  color:var(--grey-600); padding:0 13px; height:27px; border-radius:var(--radius-sm);
  cursor:pointer;
}
.umfang button[aria-pressed="true"]{background:var(--navy); color:#fff; box-shadow:0 -1px 0 var(--navy)}
.umfang button:disabled{color:var(--grey-500); cursor:not-allowed; background:var(--surface-hover)}
.umfang button:not(:disabled):not([aria-pressed="true"]):hover{background:var(--surface)}

/* Knoepfe, Form Wert fuer Wert wie .data-btn in OpenSlots und .btn-data in
   PreisWerk: Polster 5/12, Kante 1,5 px in der Fuellfarbe, 6 px rund,
   12 px halbfett — daraus ergeben sich 31 px Hoehe. Weiss ist die Regel, der
   gefuellte Knopf die Ausnahme (hier: Drucken), wie in der Datenpflege. */
.knopf{
  display:inline-flex; align-items:center; gap:6px; background:var(--white);
  color:var(--navy); border:1.5px solid var(--border); border-radius:var(--radius-md);
  padding:5px 12px; font-size:12px; font-weight:600; cursor:pointer; transition:all .15s;
}
.knopf:hover{border-color:var(--navy); background:var(--surface-hover)}
.knopf.primär{background:var(--navy); color:var(--white); border-color:var(--navy)}
.knopf.primär:hover{background:var(--navy-hover); border-color:var(--navy-hover)}
.knopf:disabled{opacity:.5; cursor:not-allowed}
.knopf:disabled:hover{border-color:var(--border); background:var(--white)}
.knopf.primär:disabled:hover{background:var(--navy); border-color:var(--navy)}
.knopf svg{width:14px; height:14px; flex:none}
/* Druckpunkt: der Knopf sinkt beim Druecken um 1 px ab, wie in allen vier
   uebrigen Werkzeugen. Gesperrte Knoepfe geben nicht nach. */
.knopf:active:not(:disabled), .umfang button:active:not(:disabled){transform:translateY(1px)}
.pfeil{font-size:.58rem; opacity:.8}

/* Klappfach fuer die Formatauswahl. Aufbau wie das Kongressmenue in OpenSlots
   (.kg-menu): weisse Flaeche, feiner Rand, 6 px rund, mittlerer Schatten. Es
   oeffnet ueber dem Blatt, damit die Liste die Seite nicht verschiebt. */
.fach{position:relative; display:inline-flex}
.fach-liste{
  position:absolute; z-index:20; top:calc(100% + 6px); left:0; width:330px;
  max-height:60vh; overflow-y:auto; background:var(--white); border:1px solid var(--border);
  border-radius:var(--radius-md); box-shadow:var(--shadow-md); padding:0 0 5px;
}
.fach-liste .kopf{
  position:sticky; top:0; z-index:2; background:var(--white); display:flex; gap:10px;
  padding:8px 14px; border-bottom:1px solid var(--border);
}
.fach-liste .kopf button{
  font-size:12px; font-weight:600; background:none; border:0; padding:0;
  color:var(--blue); cursor:pointer; text-decoration:underline;
}
.fach-liste .kopf button:hover{color:var(--navy)}
.fach-liste .gruppe{
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--navy); padding:9px 14px 3px;
}
.fach-liste label{
  display:flex; align-items:flex-start; gap:8px; padding:3px 14px;
  font-size:13px; cursor:pointer; line-height:1.35;
}
.fach-liste label:hover{background:var(--surface-hover)}
.fach-liste input{accent-color:var(--navy); width:15px; height:15px; margin-top:2px; flex:none}

/* Der Stand der Zahlen steht am rechten Ende des freien Raumes, wie .bar-status
   in OpenSlots, MediaQuote und PreisWerk; der Leerraum der Leiste sammelt sich
   davor. Der Druckknopf folgt dahinter in einer eigenen Gruppe mit feinem
   Trennstrich — 1 x 16 px, senkrecht mittig, wie dort. */
.bar-status{display:inline-flex; align-items:center; gap:8px; margin-left:auto; text-align:right}
.bar-grp{display:inline-flex; align-items:center; gap:8px; padding-left:10px; position:relative}
.bar-grp::before{
  content:""; position:absolute; left:0; top:50%; margin-top:-8px;
  width:1px; height:16px; background:var(--border);
}
.status{display:inline-flex; align-items:center; gap:6px; font-size:11.5px; color:var(--grey-600)}
.status b{color:var(--navy); font-weight:600}
.status svg{display:none}
/* Fehlt einem Jahrgang etwas, wird das nicht rot gemeldet: es ist nichts
   schiefgegangen, es fehlt nur eine Haelfte. Flaeche und Zeichen wie .data-note
   in PreisWerk. */
.status.warnt{
  font-size:12.5px; background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-md); padding:4px 10px; text-align:left;
}
.status.warnt svg{display:block; width:14px; height:14px; flex:none; color:var(--navy)}

/* ── Schalterleiste ──────────────────────────────────────────────────────
   Was auf dem Blatt erscheint, wird in einer eigenen Karte gewaehlt — getrennt
   von der Auswahl darueber, wie .options-bar in PreisWerk (12/24 gepolstert,
   8 px rund, 20 px Abstand). Ein Schalter erscheint nur, wenn der Titel auch
   etwas zu schalten hat; bleibt keiner uebrig, entfaellt die ganze Karte. */
.schalter{
  display:flex; align-items:center; gap:20px; flex-wrap:wrap; background:var(--white);
  border:1px solid var(--border); border-radius:var(--radius-lg); padding:12px 24px;
  margin:12px 24px 0; box-shadow:var(--shadow-sm);
}
.schalter label{
  display:inline-flex; align-items:center; gap:7px; font-size:13px; font-weight:500;
  color:var(--navy); cursor:pointer; white-space:nowrap;
}
.schalter input{accent-color:var(--navy); width:15px; height:15px; cursor:pointer}

/* ── Buehne und Blatt ─────────────────────────────────────────────────────
   Ein Blatt ist genau eine A4-Seite. Am Bildschirm liegt es auf dem kuehlen
   Grund und traegt denselben Schatten wie das Angebotsblatt in MediaQuote
   (.page), im Druck ist es nackt und hat einen harten Seitenwechsel hinter
   sich. Die Breite bleibt am Bildschirm bei 210 mm: rechnete die Vorschau mit
   einer anderen Breite, braeche sie anders um als der Drucker. */
.buehne{padding:20px 24px 60px; overflow-x:auto}
.nichts{
  max-width:62ch; margin:30px auto; padding:18px 20px; background:var(--white);
  border:1px solid var(--border); border-radius:var(--radius-lg); box-shadow:var(--shadow-sm);
  font-size:13px; color:var(--grey-600);
}
.nichts a{color:var(--blue)}
/* Die Zeilenhoehe des Blattes steht fest und wird nicht vom Werkzeug geerbt.
   Der Umbruch ist gegen diese Metrik gemessen und belegt; erbte das Blatt die
   1,5 der Bedienung, fielen die Zeilen 0,6 px flacher aus, es passten mehr
   Zeilen auf eine Seite, und die Abweichung zwischen Bildschirm und Drucker
   summierte sich ueber mehr Zeilen. Belegt am 13.09.2026 beim Angleichen der
   Optik: drei Blaetter am Bildschirm, vier Seiten aus dem Drucker. */
.blatt{
  width:210mm; height:297mm; margin:0 auto 22px; background:var(--white);
  border-radius:var(--radius-sm); box-shadow:0 2px 20px rgba(0,40,90,.12);
  padding:16mm 15mm 14mm; display:flex; flex-direction:column; line-height:1.55;
}
.blattkopf{
  display:flex; align-items:flex-start; gap:16px;
  border-bottom:2px solid var(--navy); padding-bottom:9px;
}
.blattkopf .links{flex:1 1 auto; min-width:0}
.blattkopf .art{
  font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--orange); margin:0 0 2px;
}
.blattkopf h1{
  font-family:var(--font-title); font-weight:600;
  font-size:27px; line-height:1.1; margin:0; color:var(--navy);
}
.blattkopf .unter{font-size:13px; color:var(--grey-600); margin-top:3px}
.blattkopf .unter b{color:var(--text); font-weight:600}
.blattkopf .rechts{flex:none; text-align:right; padding-top:2px}
.blattkopf .jahrgang{
  font-family:var(--font-title); font-size:22px;
  color:var(--navy); margin-top:7px; line-height:1;
}
.stand{
  display:flex; align-items:center; gap:9px; flex-wrap:wrap;
  margin:9px 0 0; font-size:11.5px; color:var(--grey-600);
}
/* Der Vermerk in der warmen Toenung des Hauses (--orange-light mit oranger
   Kante), wie die Hinweise in OpenSlots. */
.stand .fahne{
  background:var(--orange-light); color:var(--orange-dark); border:1px solid var(--orange);
  border-radius:999px; padding:2px 9px; font-weight:700; font-size:10px;
  letter-spacing:.06em; text-transform:uppercase;
}

/* Die Tabellen des Blattes folgen der Jahresvorschau, dem anderen Dokument,
   das aus dem Haus geht: Spaltenkoepfe navy und in Kapitaelchen ueber einer
   feinen Linie, keine gefuellte Kopfzeile. */
h2.abschnitt{
  font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
  color:var(--navy); margin:16px 0 6px; padding-bottom:4px;
  border-bottom:1px solid var(--border);
}
table{width:100%; border-collapse:collapse; font-size:11.5px}
thead th{
  font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase;
  color:var(--navy); text-align:left; padding:0 5px 4px;
  border-bottom:1px solid var(--border); white-space:nowrap;
}
thead th.zahl{text-align:right}
thead th.mitte{text-align:center}
tbody td{padding:3.2px 5px; border-bottom:1px solid var(--linie); vertical-align:top}
tr.gruppe th{
  background:var(--surface); color:var(--navy); font-size:9.5px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; text-align:left;
  padding:4px 5px; border-bottom:1px solid var(--border);
}
td.zahl{text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap}
td.zahl.stark{font-weight:700; color:var(--navy)}
td.mitte{text-align:center}
td.klein{font-size:10px}
td.grau{color:var(--grey-600)}
td.fmt{width:44%}
.leer{color:var(--grey-500)}

/* Termine: die beiden Textspalten tragen, was die festen Spalten uebrig lassen. */
.termine td.thema{font-size:10.5px}
.termine td.kong{font-size:9.8px; color:var(--grey-600); line-height:1.35}
.termine tbody td{padding:4.5px 5px}

.legende{margin-top:9px; font-size:10px; color:var(--grey-600); line-height:1.5}
.legende b{color:var(--text)}
.fuss{
  margin-top:auto; padding-top:9px; border-top:1px solid var(--border);
  display:flex; justify-content:space-between; align-items:flex-end; gap:14px;
  font-size:10px; color:var(--grey-600);
}
/* Der Ansprechpartner wird unmittelbar im Fuss geschrieben; die Eingabe auf der
   ersten Seite wandert beim Verlassen des Feldes auf die uebrigen Seiten. */
.kontakt{
  min-width:180px; outline:0; border-radius:var(--radius-sm); padding:2px 4px;
  margin:-2px -4px; white-space:pre-wrap;
}
.blatt:first-of-type .kontakt:hover{background:var(--surface-hover)}
.blatt:first-of-type .kontakt:focus{background:var(--white); box-shadow:0 0 0 2px var(--blue-light)}
.kontakt:empty::before{content:attr(data-platzhalter); color:var(--grey-500)}
.fuss .seite{white-space:nowrap; text-align:right}

/* ── Druck ────────────────────────────────────────────────────────────────
   Nur die Blaetter, je Blatt eine Seite. Die Bedienung verschwindet. */
@media print{
  @page{size:A4; margin:0}
  html,body{background:#fff}
  .sm-hero,.leiste,.schalter,.nichts{display:none!important}
  .buehne{padding:0; overflow:visible}
  .blatt{
    width:auto; height:auto; margin:0; border-radius:0; box-shadow:none;
    padding:16mm 15mm 14mm; break-after:page;
  }
  .blatt:last-child{break-after:auto}
  .kontakt:empty::before{content:''}
}

@media (max-width:900px){
  .leiste,.schalter{margin-left:12px; margin-right:12px}
  .buehne{padding:16px 10px 40px}
}
</style>
</head>
<body>

<!-- Kopfleiste (Hero-Streifen) · derselbe Aufbau wie in OpenSlots, MediaQuote,
     PreisWerk und der Datenpflege: Verlagszeichen, Trennstrich, Name des
     Werkzeugs mit dem Akzent im zweiten Wort, Rueckweg zur Startseite, darunter
     ein Satz zur Bedienung. -->
<div class="sm-hero">
  <div class="sm-hero-inner">
    <div class="sm-hero-head">

<script>
/* ═══════════════════════════════════════════════════════════════════════════
   Bezug der Daten

   Erste Quelle ist die Datenbank, gelesen ohne Anmeldung — die Zeilenschutz-
   Regeln geben Preise und Termine frei und sperren nur das Aendern. Gelingt
   das nicht, wird die Angebotsdaten.xlsx von der Adresse geholt; sie ist der
   Notweg und liefert dann auch den Stand, weil ihr die Zeitstempel der
   einzelnen Zeilen fehlen.
   ═══════════════════════════════════════════════════════════════════════ */

const DB_FELDER =
  'jahr,name,auflage,fachbereich,reihenfolge,' +
  'preis(reihenfolge,kategorie,format,preis,zuschlag_4c,rabattfaehig,ae_faehig,' +
  'termin_art,geaendert_am),' +
  'termin(reihenfolge,heft,monat,et,anzeigenschluss,du_schluss,eh_termin,' +
  'themen,kongresse,geaendert_am)';

let BESTAND = {};        // { jahr: { titel: {auflage, fach, preise:[], termine:[], stand} } }
let HERKUNFT = '';       // woher die Zahlen stammen — steht in der Statuszeile
let AUSWAHL = null;      // abgewaehlte Formate des offenen Blattes (Set), sonst null

function dbErreichbar(){
  return typeof SUPABASE_URL === 'string' && typeof SUPABASE_ANON_KEY === 'string'
      && SUPABASE_URL && SUPABASE_ANON_KEY;
}

async function dbHolen(pfad){
  const r = await fetch(SUPABASE_URL + '/rest/v1/' + pfad, {
    headers:{ apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY },
    cache:'no-cache'
  });
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/* Der Stand eines Blattes ist der juengste Aenderungszeitpunkt aus den Preis-
   und Terminzeilen genau dieses Titels und Jahrgangs — nicht der verlagsweite
   Stand, den die uebrigen Werkzeuge zeigen. Nur so bedeutet „Stand 12.09.2026"
   auch, dass an diesen Preisen seither nichts geaendert wurde. */
function juengster(zeilen){
  let m = null;
  (zeilen || []).forEach(z => {
    if(!z.geaendert_am) return;
    const d = new Date(z.geaendert_am);
    if(!isNaN(d) && (!m || d > m)) m = d;
  });
  return m;
}

function datumText(d){
  if(!d || isNaN(d)) return '';
  const q = n => String(n).padStart(2,'0');
  return q(d.getDate()) + '.' + q(d.getMonth()+1) + '.' + d.getFullYear();
}

function datenbankZuBestand(titel){
  const B = {};
  titel.forEach(t => {
    const jahr = String(t.jahr), name = t.name;
    if(!jahr || !name) return;
    if(!B[jahr]) B[jahr] = {};
    B[jahr][name] = {
      auflage: Number(t.auflage) || 0,
      fach: t.fachbereich || '',
      preise: (t.preis || []).map(z => ({
        kategorie: z.kategorie || 'Sonstige',
        format: z.format || '',
        preis: z.preis == null ? null : Number(z.preis),
        zuschlag: z.zuschlag_4c == null ? null : Number(z.zuschlag_4c),
        rabatt: !!z.rabattfaehig,
        terminart: (z.termin_art || '').trim().toUpperCase()
      })).filter(z => z.format),
      termine: (t.termin || []).map(a => ({
        heft: String(a.heft || ''), monat: a.monat || '', et: a.et || '',
        as: a.anzeigenschluss || '', du: a.du_schluss || '', eh: a.eh_termin || '',
        themen: a.themen || '', kongresse: a.kongresse || ''
      })),
      stand: datumText(juengster([].concat(t.preis || [], t.termin || [])))
    };
  });
  return B;
}

async function ausDatenbank(){
  if(!dbErreichbar()) return false;
  try{
    const titel = await dbHolen(
      'titel?select=' + encodeURIComponent(DB_FELDER) +
      '&order=jahr.asc,reihenfolge.asc&preis.order=reihenfolge.asc' +
      '&termin.order=reihenfolge.asc&limit=500');
    const B = datenbankZuBestand(titel);
    if(!B || !Object.keys(B).length) throw new Error('Keine Jahrgänge in der Datenbank.');
    BESTAND = B; HERKUNFT = 'Preisliste aus der Datenbank';
    return true;
  }catch(e){
    console.warn('Preisliste nicht aus der Datenbank geholt:', e);
    return false;   /* kein Fehler, sondern der Uebergang zum Notweg */
  }
}

/* ── Notweg: die Angebotsdaten.xlsx von der Adresse ───────────────────────
   Beim Oeffnen per Doppelklick (file://) verbietet der Browser das Lesen der
   Nachbardatei; dann bleibt es bei der Meldung, statt etwas Falsches zu
   behaupten. Die Mappe fuehrt keine Zeitstempel je Zeile — der Stand kommt
   deshalb aus ihrem Speicherzeitpunkt und gilt fuer alle Titel gleich. */
function ensureExcelJS(){
  if(window.ExcelJS) return Promise.resolve();
  return new Promise((ok, nein) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js';
    s.onload = ok;
    s.onerror = () => nein(new Error('ExcelJS konnte nicht geladen werden.'));
    document.head.appendChild(s);
  });
}

function zelle(w){ return (w == null) ? '' : String(w).trim(); }
function zahl(w){
  if(w == null || w === '') return null;
  const n = Number(w);
  return isNaN(n) ? null : n;
}

function mappeZuBestand(mappe){
  const B = {};
  const bl = (name) => mappe.getWorksheet(name);
  const preise = bl('Preise'), termine = bl('Termine');
  if(!preise) throw new Error('Blatt „Preise" fehlt.');

  const fach = (jahr, titel, wert) => {
    if(!B[jahr]) B[jahr] = {};
    if(!B[jahr][titel]) B[jahr][titel] = { auflage:0, fach:'', preise:[], termine:[], stand:'' };
    if(wert && !B[jahr][titel].fach) B[jahr][titel].fach = wert;
    return B[jahr][titel];
  };

  preise.eachRow((zeile, nr) => {
    if(nr === 1) return;
    const w = i => zeile.getCell(i).value;
    const jahr = zelle(w(1)), titel = zelle(w(2));
    if(!jahr || !titel) return;
    const t = fach(jahr, titel, zelle(w(11)));
    const a = zahl(w(3)); if(a && !t.auflage) t.auflage = a;
    const format = zelle(w(5));
    if(!format) return;
    t.preise.push({
      kategorie: zelle(w(4)) || 'Sonstige', format: format,
      preis: zahl(w(6)), zuschlag: zahl(w(7)),
      rabatt: zelle(w(8)).toLowerCase() === 'ja',
      terminart: zelle(w(10)).toUpperCase()
    });
  });

  if(termine) termine.eachRow((zeile, nr) => {
    if(nr === 1) return;
    const w = i => zeile.getCell(i).value;
    const jahr = zelle(w(1)), titel = zelle(w(2));
    if(!jahr || !titel) return;
    const t = fach(jahr, titel, '');
    t.termine.push({
      heft: zelle(w(3)), monat: zelle(w(4)), et: zelle(w(5)), as: zelle(w(6)),
      du: zelle(w(7)), eh: zelle(w(8)), themen: zelle(w(9)), kongresse: zelle(w(10))
    });
  });
  return B;
}

async function ausMappe(){
  if(location.protocol === 'file:') return false;
  try{
    const r = await fetch('Angebotsdaten.xlsx', { cache:'no-cache' });
    if(!r.ok) throw new Error('HTTP ' + r.status);
    const puffer = await r.arrayBuffer();
    await ensureExcelJS();
    const mappe = new ExcelJS.Workbook();
    await mappe.xlsx.load(puffer);
    const B = mappeZuBestand(mappe);
    if(!B || !Object.keys(B).length) throw new Error('Keine Jahrgänge in der Datei.');
    /* Ein Stand fuer alle: der Speicherzeitpunkt der Mappe. */
    const d = mappe.modified ? new Date(mappe.modified) : null;
    const s = datumText(d);
    Object.keys(B).forEach(j => Object.keys(B[j]).forEach(t => { B[j][t].stand = s; }));
    BESTAND = B; HERKUNFT = 'Angebotsdaten.xlsx (Notweg)';
    return true;
  }catch(e){
    console.warn('Preisliste nicht von der Adresse geholt:', e);
    return false;
  }
}

/* ═══════════════════════════════════════════════════════════════════════════
   Hilfen
   ═══════════════════════════════════════════════════════════════════════ */

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function geld(v){
  if(v == null || v === '') return '';
  const n = Number(v);
  if(isNaN(n)) return '';
  let s = (Math.abs(n - Math.round(n)) < 0.005) ? String(Math.round(n)) : n.toFixed(2).replace('.', ',');
  const teile = s.split(',');
  teile[0] = teile[0].replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  return teile.join(',');
}

/* Termine stehen als „22.01." ohne Jahr in den Daten; die Werkzeuge ergaenzen
   es selbst und lassen Angaben mit eigener Jahreszahl unangetastet. Faellt ein
   Anzeigenschluss in den Dezember vor dem Jahrgang, gehoert er ins Vorjahr —
   dieselbe Regel wie in den uebrigen Werkzeugen. */
function mitJahr(text, jahr){
  const t = String(text || '').trim();
  if(!t) return null;
  const m = t.match(/^(\d{1,2})\.(\d{1,2})\.(\d{2,4})?$/);
  if(!m) return null;
  const tag = Number(m[1]), monat = Number(m[2]);
  let j;
  if(m[3]){
    j = Number(m[3]);
    if(j < 100) j += 2000;
  }else{
    j = Number(jahr);
    if(monat >= 11 && Number(jahr) && monat - 1 > 9 && false) j = Number(jahr);
  }
  const d = new Date(j, monat - 1, tag);
  return isNaN(d) ? null : d;
}

function heuteOhneZeit(){
  const d = new Date();
  return new Date(d.getFullYear(), d.getMonth(), d.getDate());
}

/* ═══════════════════════════════════════════════════════════════════════════
   Auswertung des gewaehlten Titels

   Was das Blatt zeigt, haengt ausschliesslich an den Daten: Fuehrt kein Format
   einen 4c-Zuschlag, steht nur eine Preisspalte. Fuehrt der Titel keine
   Kongresse, entfaellt die Spalte samt Schalter.
   ═══════════════════════════════════════════════════════════════════════ */

function lage(jahr, titel){
  const t = (BESTAND[jahr] || {})[titel];
  if(!t) return null;
  const preise = t.preise.filter(p => p.preis != null);
  const hatZuschlag = t.preise.some(p => p.zuschlag != null && p.zuschlag > 0);
  const grenze = heuteOhneZeit();
  const termine = t.termine.map(a => {
    const d = mitJahr(a.as, jahr);
    return Object.assign({}, a, { verstrichen: !!(d && d < grenze) });
  });
  return {
    auflage: t.auflage, fach: t.fach, stand: t.stand,
    preise: preise, alleFormate: t.preise, termine: termine,
    hatPreise: preise.length > 0,
    hatZuschlag: hatZuschlag,
    hatRabatt: t.preise.some(p => p.rabatt),
    hatTerminart: t.preise.some(p => p.terminart === 'DU' || p.terminart === 'EH'),
    hatThemen: termine.some(a => a.themen.trim()),
    hatKongresse: termine.some(a => a.kongresse.trim()),
    hatVerstrichene: termine.some(a => a.verstrichen),
    /* Eine Terminspalte, die fuer keine einzige Ausgabe gefuellt ist, gehoert
       nicht aufs Blatt — sie stuende sonst als Reihe von Leerstellen da. Das
       betrifft heute 13 der 44 Titel-Jahrgaenge; in 2028 sind alle vier leer,
       dort sind die Termine schlicht noch nicht gepflegt. */
    hatET: termine.some(a => String(a.et).trim()),
    hatAS: termine.some(a => String(a.as).trim()),
    hatDU: termine.some(a => String(a.du).trim()),
    hatEH: termine.some(a => String(a.eh).trim())
  };
}

/* Die Preiszeilen in der hinterlegten Reihenfolge, nach Kategorien gebuendelt
   und um die abgewaehlten Formate verkuerzt. Eine Kategorie, aus der alles
   abgewaehlt ist, entfaellt mitsamt ihrer Ueberschrift. */
function gruppen(L){
  const folge = [], nach = {};
  L.preise.forEach(p => {
    if(AUSWAHL && AUSWAHL.has(p.kategorie + ' § ' + p.format)) return;
    if(!nach[p.kategorie]){ nach[p.kategorie] = []; folge.push(p.kategorie); }
    nach[p.kategorie].push(p);
  });
  return folge.map(k => ({ name: k, zeilen: nach[k] }));
}

/* Laeuft der Inhalt eines Blattes ueber die Seite hinaus? Gemessen wird gegen
   die gerechnete A4-Hoehe, nicht gegen die Hoehe, die das Blatt gerade hat:
   Waechst ein Blatt mit seinem Inhalt, verschoebe es mit jeder Zeile auch den
   Massstab und der Ueberlauf bliebe unentdeckt. Kopf, Standzeile und Fuss
   stehen fest, alles dazwischen traegt die Tabelle. */
let A4_HOEHE = 0;

function a4Hoehe(){
  if(A4_HOEHE) return A4_HOEHE;
  const m = document.createElement('div');
  m.style.cssText = 'position:absolute;visibility:hidden;height:297mm';
  document.body.appendChild(m);
  A4_HOEHE = m.getBoundingClientRect().height;
  m.remove();
  return A4_HOEHE;
}

/* Zwischen Bildschirm und Drucker liegen ein paar Zehntel: Chrome setzt beim
   Drucken die Zeilen minimal anders als in der Vorschau. Ein randvolles Blatt
   kippt dadurch auf eine zusaetzliche, fast leere Seite. Die Reserve von 8 px —
   gut zwei Millimeter — faengt das ab; belegt am 13.09.2026 an „Die Onkologie"
   2026, das ohne Reserve als drei Blaetter gemessen wurde und als vier Seiten
   aus dem Drucker kam. */
const RESERVE = 8;

function laeuftUeber(blatt){
  const cs = getComputedStyle(blatt);
  const innen = a4Hoehe() - parseFloat(cs.paddingTop) - parseFloat(cs.paddingBottom);
  let belegt = 0;
  Array.from(blatt.children).forEach(k => { belegt += k.offsetHeight; });
  return belegt > innen - RESERVE;
}

function preisKopf(zeigeRabatt, zeigeTermin, einspaltig){
  let h = '<thead><tr><th>Format</th>';
  if(einspaltig){
    h += '<th class="zahl">4c-Preis €</th>';
  }else{
    h += '<th class="zahl">s/w-Preis €</th><th class="zahl">4c-Zuschlag €</th>' +
         '<th class="zahl">4c-Preis €</th>';
  }
  if(zeigeTermin) h += '<th class="mitte">Termin</th>';
  if(zeigeRabatt) h += '<th class="mitte">Rabatt</th>';
  return h + '</tr></thead>';
}

function preisZeile(p, zeigeRabatt, zeigeTermin, einspaltig){
  let h = '<tr><td class="fmt">' + esc(p.format) + '</td>';
  if(einspaltig){
    h += '<td class="zahl stark">' + geld(p.preis) + '</td>';
  }else{
    const vier = (p.preis != null && p.zuschlag != null && p.zuschlag > 0)
      ? geld(Number(p.preis) + Number(p.zuschlag)) : '';
    h += '<td class="zahl">' + geld(p.preis) + '</td>' +
         '<td class="zahl">' + (p.zuschlag ? geld(p.zuschlag) : '') + '</td>' +
         '<td class="zahl stark">' + vier + '</td>';
  }
  if(zeigeTermin) h += '<td class="mitte klein">' + esc(p.terminart || '') + '</td>';
  if(zeigeRabatt) h += '<td class="mitte klein grau">' + (p.rabatt ? 'R' : '') + '</td>';
  return h + '</tr>';
}

function preisLegende(L, zeigeRabatt, zeigeTermin, einspaltig){
  const teile = [];
  if(zeigeTermin){
    teile.push('<b>Termin</b> – maßgeblicher Produktionstermin je Format: ' +
               '<b>DU</b> Druckunterlagenschluss, <b>EH</b> Anlieferung der Einhefter und Beilagen.');
  }else if(L.hatTerminart){
    teile.push('Der maßgebliche Produktionstermin wird je Format mitgeteilt.');
  }
  if(zeigeRabatt) teile.push('<b>Rabatt</b> – <b>R</b> kennzeichnet rabattfähige Formate.');
  teile.push('Alle Formate sind AE-provisionsfähig.');
  teile.push('Alle Preise verstehen sich zuzüglich der gesetzlichen Umsatzsteuer.');
  return '<div class="legende">' + teile.join(' ') + '</div>';
}

/* Setzt eine Tabelle mit gegebenen Zeilen ans Ende des Blattes. Die Tabelle
   wird jedes Mal neu geschrieben, weil eine Zeile beim Umbruch von einem Blatt
   auf das naechste wandert. */
function tabelleSetzen(blatt, kopfHtml, zeilenHtml, klasse){
  let t = koerper(blatt).querySelector('table');
  if(!t){
    koerper(blatt).insertAdjacentHTML('beforeend',
      '<table' + (klasse ? ' class="' + klasse + '"' : '') + '>' + kopfHtml + '<tbody></tbody></table>');
    t = koerper(blatt).querySelector('table');
  }
  t.querySelector('tbody').innerHTML = zeilenHtml.join('');
}

/* ── Preisseiten ────────────────────────────────────────────────────────── */
function preisseitenBauen(L){
  const zeigeRabatt = document.getElementById('sRabatt').checked && L.hatRabatt;
  const zeigeTermin = document.getElementById('sTermin').checked && L.hatTerminart;
  const einspaltig = !L.hatZuschlag;
  const kopfHtml = preisKopf(zeigeRabatt, zeigeTermin, einspaltig);
  const legende = preisLegende(L, zeigeRabatt, zeigeTermin, einspaltig);
  const unter = 'Fachbereich ' + esc(L.fach) +
                (L.auflage ? ' · Auflage <b>' + geld(L.auflage) + '</b> Exemplare' : '') +
                (L.termine.length ? ' · ' + L.termine.length + ' Ausgaben im Jahr' : '');

  const G = gruppen(L);
  if(!G.length) return;

  let blatt = neuesBlatt('Anzeigenpreisliste', unter);
  koerper(blatt).insertAdjacentHTML('beforeend', '<h2 class="abschnitt">Preise</h2>');
  let zeilen = [];

  /* Die Legende steht auf jeder Preisseite, nicht nur auf der letzten: So ist
     die Hoehenrechnung fuer alle Seiten gleich, und ein einzeln weitergereichtes
     Blatt traegt seine Erklaerung bei sich. */
  const legendeSetzen = (b) => {
    if(!b.querySelector('.legende')) koerper(b).insertAdjacentHTML('beforeend', legende);
  };

  const anfuegen = (html) => {
    zeilen.push(html);
    tabelleSetzen(blatt, kopfHtml, zeilen, null);
    legendeSetzen(blatt);
    if(laeuftUeber(blatt)){
      zeilen.pop();
      tabelleSetzen(blatt, kopfHtml, zeilen, null);
      return false;      /* passt nicht mehr */
    }
    return true;
  };

  G.forEach(g => {
    const kopf = '<tr class="gruppe"><th colspan="' +
      (1 + (einspaltig ? 1 : 3) + (zeigeTermin ? 1 : 0) + (zeigeRabatt ? 1 : 0)) +
      '">' + esc(g.name) + '</th></tr>';
    let fortsetzung = false;
    let i = 0;
    while(i < g.zeilen.length){
      /* Die Gruppenueberschrift zaehlt zur Gruppe: steht sie als Letztes auf
         einer Seite, gehoert sie mit auf die naechste. */
      const merk = zeilen.length;
      if(!anfuegen(fortsetzung
            ? kopf.replace('</th>', ' (Fortsetzung)</th>')
            : kopf)){
        blatt = neuesBlatt('Anzeigenpreisliste · Fortsetzung', unter);
        zeilen = [];
        anfuegen(fortsetzung ? kopf.replace('</th>', ' (Fortsetzung)</th>') : kopf);
      }
      let gesetzt = 0;
      while(i < g.zeilen.length){
        if(anfuegen(preisZeile(g.zeilen[i], zeigeRabatt, zeigeTermin, einspaltig))){
          i++; gesetzt++;
        }else{
          break;
        }
      }
      if(i < g.zeilen.length){
        /* Der Rest der Gruppe kommt auf ein neues Blatt. Wurde auf diesem Blatt
           noch keine einzige Zeile der Gruppe gesetzt, wandert auch die
           Ueberschrift mit, damit sie nicht allein stehen bleibt. */
        if(gesetzt === 0){ zeilen.pop(); tabelleSetzen(blatt, kopfHtml, zeilen, null); }
        blatt = neuesBlatt('Anzeigenpreisliste · Fortsetzung', unter);
        zeilen = [];
        fortsetzung = gesetzt > 0;
      }else{
        fortsetzung = false;
      }
    }
  });
  legendeSetzen(blatt);
}

/* ── Terminseiten ───────────────────────────────────────────────────────── */
function terminKopf(L, zeigeThemen, zeigeKong){
  let h = '<thead><tr><th class="mitte">Heft</th><th>Monat</th>';
  if(L.hatET) h += '<th class="mitte">ET</th>';
  if(L.hatAS) h += '<th class="mitte">AS</th>';
  if(L.hatDU) h += '<th class="mitte">DU</th>';
  if(L.hatEH) h += '<th class="mitte">EH</th>';
  if(zeigeThemen) h += '<th>Themenschwerpunkte</th>';
  if(zeigeKong)   h += '<th>Kongresse (Auslage)</th>';
  return h + '</tr></thead>';
}

function terminZeile(L, a, zeigeThemen, zeigeKong){
  const mehrzeilig = (t) => {
    const s = String(t || '').trim();
    if(!s) return '<span class="leer">–</span>';
    return s.split(/\r?\n/).filter(z => z.trim()).map(z => esc(z.trim())).join('<br>');
  };
  let h = '<tr><td class="mitte stark">' + esc(a.heft) + '</td>' +
          '<td>' + esc(a.monat) + '</td>';
  if(L.hatET) h += '<td class="mitte">' + esc(a.et) + '</td>';
  if(L.hatAS) h += '<td class="mitte">' + esc(a.as) + '</td>';
  if(L.hatDU) h += '<td class="mitte">' + esc(a.du) + '</td>';
  if(L.hatEH) h += '<td class="mitte">' + esc(a.eh) + '</td>';
  if(zeigeThemen) h += '<td class="thema">' + (a.themen.trim() ? esc(a.themen) : '<span class="leer">–</span>') + '</td>';
  if(zeigeKong)   h += '<td class="kong">' + mehrzeilig(a.kongresse) + '</td>';
  return h + '</tr>';
}

/* Kaeme ueberhaupt ein Terminblatt zustande? Heftnummer und Monat allein
   ergeben keines; es braucht mindestens einen Termin, ein Thema oder einen
   Kongress. */
function hatTerminblatt(L){
  if(!L || !L.termine.length) return false;
  const zeigeThemen = document.getElementById('sThemen').checked && L.hatThemen;
  const zeigeKong   = document.getElementById('sKong').checked && L.hatKongresse;
  return !!(L.hatET || L.hatAS || L.hatDU || L.hatEH || zeigeThemen || zeigeKong);
}

function terminseitenBauen(L){
  const zeigeThemen = document.getElementById('sThemen').checked && L.hatThemen;
  const zeigeKong   = document.getElementById('sKong').checked && L.hatKongresse;
  const ohneAlte    = document.getElementById('sVergangen').checked && L.hatVerstrichene;
  const liste = L.termine.filter(a => !(ohneAlte && a.verstrichen));
  if(!liste.length) return;
  /* Ohne Termine und ohne Themen bliebe eine Tabelle aus Heftnummern und
     Monatsnamen — das ist keine Terminliste, sondern ein Geruest. */
  if(!L.hatET && !L.hatAS && !L.hatDU && !L.hatEH && !zeigeThemen && !zeigeKong) return;

  const kopfHtml = terminKopf(L, zeigeThemen, zeigeKong);
  const kuerzel = [];
  if(L.hatET) kuerzel.push('<b>ET</b> Erscheinungstermin');
  if(L.hatAS) kuerzel.push('<b>AS</b> Anzeigenschluss');
  if(L.hatDU) kuerzel.push('<b>DU</b> Druckunterlagenschluss');
  if(L.hatEH) kuerzel.push('<b>EH</b> Anlieferung Einhefter und Beilagen');
  const legende =
    '<div class="legende">' +
    (kuerzel.length ? kuerzel.join(' · ') + '. Terminangaben ohne Jahreszahl beziehen sich auf ' +
                      esc(GEWAEHLT.jahr) + '. ' : '') +
    (ohneAlte ? 'Ausgaben mit verstrichenem Anzeigenschluss sind nicht aufgeführt.' : '') +
    '</div>';
  const unter = 'Erscheinungstermine, Anzeigenschluss und Produktionstermine je Ausgabe';

  let blatt = neuesBlatt('Termine und Themen', unter);
  koerper(blatt).insertAdjacentHTML('beforeend', '<h2 class="abschnitt">Ausgaben</h2>');
  let zeilen = [];

  const legendeSetzen = (b) => {
    if(!b.querySelector('.legende')) koerper(b).insertAdjacentHTML('beforeend', legende);
  };

  liste.forEach(a => {
    zeilen.push(terminZeile(L, a, zeigeThemen, zeigeKong));
    tabelleSetzen(blatt, kopfHtml, zeilen, 'termine');
    legendeSetzen(blatt);
    if(laeuftUeber(blatt)){
      zeilen.pop();
      tabelleSetzen(blatt, kopfHtml, zeilen, 'termine');
      blatt = neuesBlatt('Termine und Themen · Fortsetzung', unter);
      koerper(blatt).insertAdjacentHTML('beforeend', '<h2 class="abschnitt">Ausgaben</h2>');
      zeilen = [terminZeile(L, a, zeigeThemen, zeigeKong)];
      tabelleSetzen(blatt, kopfHtml, zeilen, 'termine');
      legendeSetzen(blatt);
    }
  });
  legendeSetzen(blatt);
}

/* ═══════════════════════════════════════════════════════════════════════════
   Zeichnen
   ═══════════════════════════════════════════════════════════════════════ */

let GEWAEHLT = { jahr:'', titel:'' };
let AKTUELL = null;
const KONTAKT_SCHLUESSEL = 'mediaSheetKontakt';

function umfang(){
  const b = document.querySelector('.umfang button[aria-pressed="true"]');
  return b ? b.id : 'uBeides';
}

function zeichnen(){
  const buehne = document.getElementById('buehne');
  buehne.innerHTML = '';
  SEITEN = [];
  const L = AKTUELL = lage(GEWAEHLT.jahr, GEWAEHLT.titel);
  if(!L){ document.getElementById('druckKnopf').disabled = true; return; }

  const modus = umfang();
  if(modus !== 'uTermine' && L.hatPreise) preisseitenBauen(L);
  if(modus !== 'uPreise') terminseitenBauen(L);

  /* Seitenzaehlung erst, wenn feststeht, wie viele es geworden sind. */
  const kopf = GEWAEHLT.titel + ' · Jahrgang ' + GEWAEHLT.jahr;
  SEITEN.forEach((b, i) => {
    b.querySelector('.seite').textContent =
      kopf + ' · Seite ' + (i+1) + ' von ' + SEITEN.length;
  });
  kontaktSetzen();
  document.getElementById('druckKnopf').disabled = SEITEN.length === 0;
  if(!SEITEN.length){
    buehne.innerHTML =
      '<div class="nichts">Für diesen Titel und Jahrgang sind weder Preise noch ' +
      'Termine hinterlegt. Gepflegt wird beides in der ' +
      '<a href="Datenpflege.html">Datenpflege</a>.</div>';
  }

  /* Der Dokumenttitel wird zum Dateinamen, den der Browser beim Sichern als
     PDF vorschlaegt. Er soll den Empfaenger etwas angehen, nicht die Ablage. */
  const zusatz = modus === 'uPreise' ? 'Preise'
               : modus === 'uTermine' ? 'Termine'
               : (L.hatPreise ? 'Preise und Termine' : 'Termine');
  document.title = GEWAEHLT.titel + ' ' + GEWAEHLT.jahr + ' – ' + zusatz;
}

/* ── Ansprechpartner ──────────────────────────────────────────────────────
   Geschrieben wird im Fuss der ersten Seite; beim Verlassen des Feldes wandert
   der Text auf die uebrigen Seiten und in den Zwischenspeicher des Geraetes.
   Dasselbe Verfahren wie das Absenderfeld in MediaQuote, aber mit eigenem
   Schluessel — die Werkzeuge sollen nicht aneinanderhaengen. */
function kontaktSetzen(){
  let text = '';
  try{ text = localStorage.getItem(KONTAKT_SCHLUESSEL) || ''; }catch(e){}
  SEITEN.forEach((b, i) => {
    const k = b.querySelector('.kontakt');
    k.textContent = text;
    if(i === 0){
      k.setAttribute('contenteditable', 'true');
      k.addEventListener('blur', () => {
        const neu = k.textContent.trim();
        try{ localStorage.setItem(KONTAKT_SCHLUESSEL, neu); }catch(e){}
        SEITEN.forEach(x => { if(x !== b) x.querySelector('.kontakt').textContent = neu; });
      });
    }
  });
}

/* ── Formatliste ──────────────────────────────────────────────────────────
   Die Auswahl gilt nur fuer das offene Blatt: Bei jedem Wechsel von Titel oder
   Jahrgang sind wieder alle Formate da. Das Blatt weist fehlende Formate
   bewusst nicht aus — deshalb darf keine vergessene Auswahl ueberdauern. */
function fachAufbauen(){
  const L = AKTUELL;
  const feld = document.getElementById('fachFeld');
  const liste = document.getElementById('fachListe');
  if(!L || !L.hatPreise){ feld.hidden = true; liste.hidden = true; return; }
  feld.hidden = false;

  const folge = [], nach = {};
  L.preise.forEach(p => {
    if(!nach[p.kategorie]){ nach[p.kategorie] = []; folge.push(p.kategorie); }
    nach[p.kategorie].push(p);
  });

  let h = '<div class="kopf"><button type="button" id="fachAlle">Alle wählen</button>' +
          '<button type="button" id="fachKeins">Alle abwählen</button></div>';
  folge.forEach(k => {
    h += '<div class="gruppe">' + esc(k) + '</div>';
    nach[k].forEach(p => {
      const s = k + ' § ' + p.format;
      const an = !(AUSWAHL && AUSWAHL.has(s));
      h += '<label><input type="checkbox" data-s="' + esc(s) + '"' + (an ? ' checked' : '') +
           '> <span>' + esc(p.format) + '</span></label>';
    });
  });
  liste.innerHTML = h;

  liste.querySelectorAll('input[data-s]').forEach(el => {
    el.addEventListener('change', () => {
      if(!AUSWAHL) AUSWAHL = new Set();
      if(el.checked) AUSWAHL.delete(el.dataset.s); else AUSWAHL.add(el.dataset.s);
      fachZahlSetzen();
      zeichnen();
    });
  });
  document.getElementById('fachAlle').addEventListener('click', () => {
    AUSWAHL = null; fachAufbauen(); fachZahlSetzen(); zeichnen();
  });
  document.getElementById('fachKeins').addEventListener('click', () => {
    AUSWAHL = new Set(L.preise.map(p => p.kategorie + ' § ' + p.format));
    fachAufbauen(); fachZahlSetzen(); zeichnen();
  });
  fachZahlSetzen();
}

function fachZahlSetzen(){
  const L = AKTUELL;
  if(!L) return;
  const ganz = L.preise.length;
  const weg = AUSWAHL ? L.preise.filter(p => AUSWAHL.has(p.kategorie + ' § ' + p.format)).length : 0;
  document.getElementById('fachZahl').textContent =
    'Formate (' + (ganz - weg) + ' von ' + ganz + ')';
}

/* ── Leiste nachfuehren ───────────────────────────────────────────────────
   Ein Schalter erscheint nur, wenn der Titel auch etwas zu schalten hat. */
function leisteNachfuehren(){
  const L = AKTUELL;
  const zeigen = (id, ja) => { document.getElementById(id).hidden = !ja; };
  const modus = umfang();
  const preisteil  = L && L.hatPreise && modus !== 'uTermine';
  const terminteil = hatTerminblatt(L) && modus !== 'uPreise';

  zeigen('sRabattFeld',    !!(preisteil && L.hatRabatt));
  zeigen('sTerminFeld',    !!(preisteil && L.hatTerminart));
  zeigen('sThemenFeld',    !!(terminteil && L.hatThemen));
  zeigen('sKongFeld',      !!(terminteil && L.hatKongresse));
  zeigen('sVergangenFeld', !!(terminteil && L.hatVerstrichene));
  document.getElementById('sVorlFeld').hidden = !(preisteil || terminteil);
  document.getElementById('fachFeld').hidden = !preisteil;

  /* Bleibt kein einziger Schalter uebrig, entfaellt die ganze Karte: eine leere
     weisse Leiste ueber dem Blatt waere nur eine Fuge. */
  const kasten = document.getElementById('schalter');
  kasten.hidden = !Array.from(kasten.children).some(k => !k.hidden);

  /* Was der Titel nicht hergibt, laesst sich auch nicht waehlen. */
  const ohnePreise = !!(L && !L.hatPreise);
  const ohneTermine = !hatTerminblatt(L);
  document.getElementById('uBeides').disabled  = ohnePreise || ohneTermine;
  document.getElementById('uPreise').disabled  = ohnePreise;
  document.getElementById('uTermine').disabled = ohneTermine;
  if(ohnePreise && !ohneTermine) umfangSetzen('uTermine', true);
  if(ohneTermine && !ohnePreise) umfangSetzen('uPreise', true);

  const st = document.getElementById('status');
  const tx = document.getElementById('statusText');
  if(ohnePreise && ohneTermine){
    st.classList.add('warnt');
    tx.innerHTML = 'Für diesen Titel und Jahrgang sind weder Preise noch Termine ' +
                   'hinterlegt. <b>' + esc(HERKUNFT) + '</b>';
  }else if(ohnePreise){
    st.classList.add('warnt');
    tx.innerHTML = 'Für diesen Jahrgang sind noch keine Preise hinterlegt – ' +
                   'ausgegeben wird die Terminliste. <b>' + esc(HERKUNFT) + '</b>';
  }else if(ohneTermine){
    st.classList.add('warnt');
    tx.innerHTML = 'Für diesen Jahrgang sind noch keine Termine hinterlegt – ' +
                   'ausgegeben wird die Preisliste. <b>' + esc(HERKUNFT) + '</b>';
  }else{
    st.classList.remove('warnt');
    tx.innerHTML = esc(HERKUNFT) + (AKTUELL && AKTUELL.stand ? ' · Stand <b>' + esc(AKTUELL.stand) + '</b>' : '');
  }
}

function umfangSetzen(id, still){
  document.querySelectorAll('.umfang button').forEach(b => {
    b.setAttribute('aria-pressed', b.id === id ? 'true' : 'false');
  });
  try{ localStorage.setItem('mediaSheetUmfang', id); }catch(e){}
  if(!still){ leisteNachfuehren(); zeichnen(); }
}

/* ── Auswahlfelder ───────────────────────────────────────────────────────── */
function jahreListe(){ return Object.keys(BESTAND).sort(); }
function titelListe(jahr){ return Object.keys(BESTAND[jahr] || {}); }

function auswahlAufbauen(){
  const wJ = document.getElementById('wJahr'), wT = document.getElementById('wTitel');
  const jahre = jahreListe();
  if(!jahre.length) return;
  if(!GEWAEHLT.jahr || !BESTAND[GEWAEHLT.jahr]){
    GEWAEHLT.jahr = jahre.includes('2026') ? '2026' : jahre[0];
  }
  wJ.innerHTML = jahre.map(j => '<option' + (j === GEWAEHLT.jahr ? ' selected' : '') + '>' + esc(j) + '</option>').join('');
  const titel = titelListe(GEWAEHLT.jahr);
  if(!GEWAEHLT.titel || titel.indexOf(GEWAEHLT.titel) < 0) GEWAEHLT.titel = titel[0] || '';
  wT.innerHTML = titel.map(t => '<option' + (t === GEWAEHLT.titel ? ' selected' : '') + '>' + esc(t) + '</option>').join('');
}

function wechseln(){
  AUSWAHL = null;                 /* Auswahl ueberdauert den Wechsel nicht */
  AKTUELL = lage(GEWAEHLT.jahr, GEWAEHLT.titel);
  leisteNachfuehren();
  fachAufbauen();
  zeichnen();
  try{ localStorage.setItem('mediaSheetTitel', GEWAEHLT.titel);
       localStorage.setItem('mediaSheetJahr', GEWAEHLT.jahr); }catch(e){}
}

/* ── Gemerkte Einstellungen ───────────────────────────────────────────────
   Gemerkt wird alles bis auf zwei: Der Vermerk „vorlaeufig" steht bei jedem
   Oeffnen wieder auf „an", damit ein einmaliges Ausschalten nicht still auf das
   naechste Vorab-Blatt durchschlaegt. Die Formatauswahl gilt ohnehin nur fuer
   das offene Blatt. */
const GEMERKT = ['sRabatt','sTermin','sThemen','sKong','sVergangen'];

function einstellungenLesen(){
  GEMERKT.forEach(id => {
    try{
      const w = localStorage.getItem('mediaSheet_' + id);
      if(w === '0' || w === '1') document.getElementById(id).checked = (w === '1');
    }catch(e){}
  });
  document.getElementById('sVorl').checked = true;
  try{
    const u = localStorage.getItem('mediaSheetUmfang');
    if(u === 'uBeides' || u === 'uPreise' || u === 'uTermine') umfangSetzen(u, true);
    const t = localStorage.getItem('mediaSheetTitel'); if(t) GEWAEHLT.titel = t;
    const j = localStorage.getItem('mediaSheetJahr');  if(j) GEWAEHLT.jahr = j;
  }catch(e){}
}

function einstellungenMerken(id){
  if(GEMERKT.indexOf(id) < 0) return;
  try{ localStorage.setItem('mediaSheet_' + id, document.getElementById(id).checked ? '1' : '0'); }catch(e){}
}

/* ── Start ────────────────────────────────────────────────────────────────── */
async function starten(){
  einstellungenLesen();

  const ok = await ausDatenbank() || await ausMappe();
  if(!ok){
    const st = document.getElementById('status');
    st.classList.add('warnt');
    document.getElementById('statusText').textContent =
      location.protocol === 'file:'
        ? 'Die Preisliste ließ sich nicht laden. Beim Öffnen per Doppelklick verbietet der Browser das Lesen der Nachbardateien – über die Startseite im Netz funktioniert es.'
        : 'Die Preisliste ließ sich weder aus der Datenbank noch von der Adresse laden.';
    return;
  }

  auswahlAufbauen();
  wechseln();

  document.getElementById('wJahr').addEventListener('change', e => {
    GEWAEHLT.jahr = e.target.value;
    auswahlAufbauen();
    wechseln();
  });
  document.getElementById('wTitel').addEventListener('change', e => {
    GEWAEHLT.titel = e.target.value;
    wechseln();
  });
  document.querySelectorAll('.umfang button').forEach(b => {
    b.addEventListener('click', () => { if(!b.disabled) umfangSetzen(b.id); });
  });
  ['sRabatt','sTermin','sThemen','sKong','sVergangen','sVorl'].forEach(id => {
    document.getElementById(id).addEventListener('change', () => {
      einstellungenMerken(id);
      zeichnen();
    });
  });
  document.getElementById('druckKnopf').addEventListener('click', () => window.print());

  /* Klappfach: oeffnet und schliesst am Knopf, schliesst beim Klick daneben
     und mit Escape. */
  const knopf = document.getElementById('fachKnopf'), liste = document.getElementById('fachListe');
  knopf.addEventListener('click', () => {
    const auf = !liste.hidden;
    liste.hidden = auf;
    knopf.setAttribute('aria-expanded', String(!auf));
  });
  document.addEventListener('click', e => {
    if(!liste.hidden && !liste.contains(e.target) && e.target !== knopf && !knopf.contains(e.target)){
      liste.hidden = true; knopf.setAttribute('aria-expanded', 'false');
    }
  });
  document.addEventListener('keydown', e => {
    if(e.key === 'Escape' && !liste.hidden){
      liste.hidden = true; knopf.setAttribute('aria-expanded', 'false');
    }
  });

}

/* Die Schriften veraendern die Zeilenhoehen; wird vor ihrem Eintreffen
   gemessen, faellt der Umbruch falsch aus. Deshalb erst starten, wenn sie da
   sind — und notfalls nach kurzer Frist ohne sie. */
if(document.fonts && document.fonts.ready){
  document.fonts.ready.then(starten);
}else{
  window.addEventListener('load', starten);
}
</script>
