<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Preispflege – Preise und Termine · Springer Medizin</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2300285a'/%3E%3Cpath d='M9 22.5l3.2-1 9-9a2.1 2.1 0 00-3-3l-9 9-1 3.2z' fill='%23e6eaf0'/%3E%3Cpath d='M8 25.5h16' stroke='%23ee7d11' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    /* Farbwerte wie in den vier Werkzeugen (Springer Medizin Brand Hub).
       Navy primär, Orange als einziger Akzent, Neutrale kühl aus dem Navy. */
    --navy: #00285a;
    --navy-hover: #003a80;
    --blue: #0176c3;
    --blue-light: #b3dcf5;
    --orange: #ee7d11;
    --orange-dark: #c0630a;
    --red: #be1818;
    --red-bg: #fdeaea;
    --red-border: #f3c0c0;
    --green: #1d7a4f;
    --white: #ffffff;
    --surface: #eaeef4;
    --surface-hover: #f4f6fa;
    --text: #1a2340;
    --grey-600: #6b7a99;
    --grey-500: #9aa3b8;
    --border: #d6dbe8;
    --bg: #f4f6fa;
    --shadow-sm: 0 1px 3px rgba(0,40,90,.08);
    --shadow-md: 0 2px 8px rgba(0,40,90,.10);
    --shadow-lg: 0 8px 28px rgba(0,40,90,.18);
    --radius-sm: 4px;
    --radius-md: 6px;
    --radius-lg: 8px;
    --radius-xl: 10px;
    --font-body: 'Source Sans 3', system-ui, Arial, Helvetica, sans-serif;
    --font-title: 'Playfair Display', Georgia, 'Times New Roman', serif;
  }

  /* Hintergrund am Wurzelelement, nicht per min-height am body. */
  html { background: var(--bg); }
  body { font-family: var(--font-body); background: var(--bg); color: var(--text); font-size: 14px; line-height: 1.5; }

  /* ── Kopfleiste, wie in den vier Werkzeugen ── */
  .sm-hero { background: linear-gradient(135deg, #002050 0%, var(--navy) 60%, #004080 100%); padding: 1.1rem 0 1rem; border-bottom: 3px solid var(--orange); }
  .sm-hero-inner { padding: 0 1.5rem; }
  .sm-hero-head { display: flex; align-items: center; gap: 1rem; margin-bottom: 8px; }
  .sm-hero-head svg { flex: none; }
  .sm-hero-div { width: 1px; align-self: stretch; background: rgba(255,255,255,.28); flex: none; }
  .sm-hero h1 { font-family: var(--font-title); font-size: 25px; font-weight: 700; color: #fff; line-height: 1.2; margin-bottom: 2px; letter-spacing: -.01em; }
  .sm-hero h1 .sm-hero-mark { color: var(--orange); }
  .sm-hero-sub { font-size: 12px; font-weight: 600; color: rgba(255,255,255,.72); letter-spacing: .16em; text-transform: uppercase; }
  .sm-hero p { font-size: 12.5px; color: rgba(255,255,255,.72); line-height: 1.4; }
  .sm-hero p strong { color: rgba(255,255,255,.9); font-weight: 600; }
  .hero-konto { margin-left: auto; text-align: right; font-size: 12px; color: rgba(255,255,255,.72); }
  .hero-konto b { display: block; color: #fff; font-weight: 600; font-size: 12.5px; }
  .hero-konto button { margin-top: 3px; background: none; border: 1px solid rgba(255,255,255,.35); color: #fff; border-radius: var(--radius-md); font-size: 11.5px; font-family: var(--font-body); padding: 2px 9px; cursor: pointer; }
  .hero-konto button:hover { background: rgba(255,255,255,.12); }

  .wrap { max-width: 1320px; margin: 22px auto; padding: 0 20px; }

  /* ── Anmeldung ── */
  .anmeldung { max-width: 400px; margin: 60px auto; background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-xl); box-shadow: var(--shadow-md); padding: 26px 28px 24px; }
  .anmeldung h2 { font-family: var(--font-title); font-size: 21px; color: var(--navy); margin-bottom: 6px; }
  .anmeldung p { font-size: 12.5px; color: var(--grey-600); margin-bottom: 18px; }
  .anmeldung label { display: block; font-size: 11px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 5px; }
  .anmeldung input { width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13.5px; font-family: var(--font-body); color: var(--text); margin-bottom: 14px; }
  .anmeldung input:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 2px rgba(0,40,90,.08); }

  /* ── Knöpfe ── */
  .btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--border); background: var(--white); color: var(--text); border-radius: var(--radius-md); height: 30px; padding: 0 13px; font-size: 13px; font-weight: 600; cursor: pointer; font-family: var(--font-body); }
  .btn:hover { background: var(--surface-hover); }
  .btn-primär { background: var(--navy); border-color: var(--navy); color: #fff; }
  .btn-primär:hover { background: var(--navy-hover); }
  .btn-gefahr { color: var(--red); border-color: var(--red-border); }
  .btn-gefahr:hover { background: var(--red-bg); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-voll { width: 100%; justify-content: center; height: 34px; }

  /* ── Leiste ── */
  .leiste { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-xl); padding: 11px 15px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
  .leiste select { font-family: var(--font-body); font-size: 13px; font-weight: 600; padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--white); color: var(--text); cursor: pointer; }
  .leiste label { font-size: 13px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; }
  .reiter { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--white); }
  .reiter button { border: none; background: var(--white); font-family: var(--font-body); font-size: 13px; font-weight: 600; color: var(--grey-600); padding: 0 15px; height: 28px; cursor: pointer; }
  .reiter button.an { background: var(--navy); color: #fff; }
  .stand-hinweis { font-size: 12.5px; color: var(--grey-600); }
  .offen-hinweis { display: none; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; color: var(--orange-dark); background: #fdf3e7; border: 1px solid #f6ddbc; border-radius: var(--radius-md); padding: 3px 10px; }
  .offen-hinweis.an { display: inline-flex; }

  /* ── Zweispaltiger Arbeitsbereich ── */
  .arbeit { display: grid; grid-template-columns: 268px minmax(0,1fr); gap: 16px; align-items: start; }
  .spalte { background: var(--white); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-sm); overflow: hidden; }
  .titelliste { padding: 6px 0 10px; max-height: calc(100vh - 220px); overflow-y: auto; }
  .fach-kopf { font-size: 10.5px; font-weight: 700; color: var(--grey-600); text-transform: uppercase; letter-spacing: .1em; padding: 12px 14px 4px; }
  .titel-zeile { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 5px 14px; font-size: 13px; cursor: pointer; border-left: 3px solid transparent; }
  .titel-zeile:hover { background: var(--surface-hover); }
  .titel-zeile.an { background: var(--blue-light); font-weight: 600; border-left-color: var(--navy); }
  .titel-zeile .zahl { font-size: 11px; color: var(--grey-500); flex: none; }
  .titel-zeile .offen { font-size: 11px; color: var(--orange-dark); font-weight: 600; flex: none; }
  .titel-zeile .geaendert { color: var(--orange); font-weight: 700; flex: none; }

  .inhalt { padding: 14px 16px 18px; }
  .inhalt-kopf { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; padding-bottom: 9px; border-bottom: 2px solid var(--navy); }
  .inhalt-kopf h2 { font-size: 15px; font-weight: 700; color: var(--navy); }
  .inhalt-kopf .neben { font-size: 12px; color: var(--grey-600); }
  .stamm { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
  .feld { display: flex; flex-direction: column; gap: 4px; }
  .feld label { font-size: 10.5px; font-weight: 700; color: var(--navy); text-transform: uppercase; letter-spacing: .4px; }
  .feld input, .feld select { padding: 5px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-body); color: var(--text); background: var(--white); }
  .feld input:focus, .feld select:focus { outline: none; border-color: var(--navy); box-shadow: 0 0 0 2px rgba(0,40,90,.08); }

  .kat-kopf { font-size: 10.5px; font-weight: 700; color: var(--grey-600); text-transform: uppercase; letter-spacing: .1em; padding: 14px 2px 5px; display: flex; justify-content: space-between; align-items: center; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; font-size: 10px; font-weight: 700; color: var(--grey-600); text-transform: uppercase; letter-spacing: .07em; padding: 6px 6px; border-bottom: 1px solid var(--border); background: var(--surface-hover); white-space: nowrap; }
  th.r, td.r { text-align: right; }
  td { padding: 3px 6px; border-bottom: 1px solid #eef1f5; vertical-align: middle; }
  tr:hover td { background: var(--surface-hover); }
  td input, td select { width: 100%; padding: 3px 6px; border: 1px solid transparent; border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-body); color: var(--text); background: transparent; }
  td input:hover, td select:hover { border-color: var(--border); background: var(--white); }
  td input:focus, td select:focus { outline: none; border-color: var(--navy); background: var(--white); box-shadow: 0 0 0 2px rgba(0,40,90,.08); }
  td input.zahl { text-align: right; }
  td input.fehler, td select.fehler { border-color: var(--red); background: var(--red-bg); }
  td.geaendert { box-shadow: inset 2px 0 0 var(--orange); }
  .zeilen-x { border: none; background: none; color: var(--grey-500); cursor: pointer; font-size: 15px; line-height: 1; padding: 2px 5px; border-radius: var(--radius-sm); }
  .zeilen-x:hover { color: var(--red); background: var(--red-bg); }
  .fehlertext { color: var(--red); font-size: 11.5px; padding: 1px 6px 5px; }
  .leer-zeile td { color: var(--grey-500); font-style: italic; padding: 14px 6px; }
  /* Zwei Zeilen je Ausgabe: oben die Termine, darunter Thema und Kongresse über die
     ganze Breite. Die Trennlinie steht nur unter der zweiten Zeile, damit beide als
     eine Ausgabe zusammenbleiben. */
  .termin-tab tr.termin-oben td { border-bottom: none; padding-top: 6px; }
  .termin-tab tr.termin-unten td { padding-bottom: 7px; }
  .termin-tab tr.termin-unten td.marke { font-size: 10px; font-weight: 700; color: var(--grey-500);
    text-transform: uppercase; letter-spacing: .06em; text-align: right; padding-right: 8px; white-space: nowrap; }
  .termin-tab tr.termin-oben:hover td, .termin-tab tr.termin-oben:hover + tr.termin-unten td,
  .termin-tab tr.termin-unten:hover td { background: var(--surface-hover); }
  .neu-zeile { padding: 8px 2px 2px; }

  /* ── Rückfragen und Dialoge ── */
  .schleier { position: fixed; inset: 0; background: rgba(10,25,50,.42); display: flex; align-items: center; justify-content: center; padding: 20px; z-index: 50; }
  .dialog { background: var(--white); border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); width: 100%; max-width: 460px; overflow: hidden; }
  .dialog h3 { font-family: var(--font-title); font-size: 18px; color: var(--navy); padding: 16px 20px 3px; }
  .dialog .erklaerung { font-size: 12.5px; color: var(--grey-600); padding: 0 20px 12px; }
  .dialog-zeile { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 7px 20px; border-top: 1px solid #eef1f5; font-size: 13px; }
  .dialog-zeile > span { color: var(--grey-600); }
  .dialog-zeile input, .dialog-zeile select { padding: 4px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-family: var(--font-body); color: var(--text); background: var(--white); }
  .dialog-zeile input.kurz { width: 84px; text-align: right; }
  .dialog-summe { background: #eef4fa; border-top: 1px solid var(--border); padding: 9px 20px; font-size: 12.5px; color: var(--navy); }
  .dialog-knoepfe { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px; border-top: 1px solid var(--border); }
  .dialog-liste { max-height: 260px; overflow-y: auto; }
  .dialog-liste .eintrag { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 7px 20px; border-top: 1px solid #eef1f5; font-size: 13px; }
  .dialog-liste .eintrag b { font-weight: 600; }
  .dialog-liste .eintrag span { font-size: 11.5px; color: var(--grey-600); }

  .meldung { position: fixed; left: 50%; transform: translateX(-50%); bottom: 22px; background: var(--navy); color: #fff; font-size: 13px; font-weight: 600; padding: 9px 18px; border-radius: var(--radius-md); box-shadow: var(--shadow-lg); z-index: 60; }
  .meldung.schlecht { background: var(--red); }
  .fehlerkasten { display: none; align-items: flex-start; gap: 8px; font-size: 12.5px; color: var(--red); background: var(--red-bg); border: 1px solid var(--red-border); border-radius: var(--radius-md); padding: 8px 12px; margin-bottom: 14px; }
  .fehlerkasten.an { display: flex; }

  .verborgen { display: none !important; }
</style>
</head>

<script src="konfiguration.js"></script>
<script>
/* ===========================================================================
   Preispflege — Preise und Termine der Angebotswerkzeuge

   Vierter Bauabschnitt des Vorhabens „Datenbank statt Excel-Datei": die vier
   Werkzeuge lesen bereits aus der Datenbank, hier wird sie gepflegt.

   Grundzuege:
     • Gearbeitet wird auf einer Arbeitskopie. Erst „Speichern" schreibt.
     • Geprueft wird beim Eintragen, nicht erst beim Speichern: ein Preis muss
       eine Zahl sein, ein Format je Titel und Kategorie nur einmal vorkommen.
       Solange ein Fehler steht, bleibt „Speichern" gesperrt.
     • Ohne Zusatzbibliothek. Angemeldet wird ueber die Schnittstelle der
       Datenbank, geschrieben mit dem dabei ausgestellten Zugangsmerkmal.
   =========================================================================== */

/* ── Zustand ──────────────────────────────────────────────────────────────── */
const SITZUNG_SCHLUESSEL = 'preispflege_sitzung_v1';
let sitzung = null;          // { zugang, erneuerung, ablauf, benutzer }
let URSPRUNG = null;         // Stand, wie er aus der Datenbank kam
let ARBEIT   = null;         // Arbeitskopie
let gewJahr  = '';
let gewTitel = null;         // id des gewaehlten Titels
let reiter   = 'preise';
let standText = '';

/* ── Schnittstelle ────────────────────────────────────────────────────────── */
function dbErreichbar() {
  return typeof SUPABASE_URL === 'string' && typeof SUPABASE_ANON_KEY === 'string'
      && SUPABASE_URL && SUPABASE_ANON_KEY;
}

async function ruf(pfad, einstellungen = {}, mitAnmeldung = true) {
  const kopf = Object.assign({ apikey: SUPABASE_ANON_KEY }, einstellungen.headers || {});
  if (mitAnmeldung && sitzung) kopf.Authorization = 'Bearer ' + sitzung.zugang;
  else kopf.Authorization = 'Bearer ' + SUPABASE_ANON_KEY;
  const antwort = await fetch(SUPABASE_URL + pfad, Object.assign({}, einstellungen, { headers: kopf, cache: 'no-cache' }));
  if (!antwort.ok) {
    let text = '';
    try { const j = await antwort.json(); text = j.message || j.msg || j.error_description || j.hint || ''; } catch (e) {}
    const f = new Error(text || ('HTTP ' + antwort.status));
    f.status = antwort.status;
    throw f;
  }
  if (antwort.status === 204) return null;
  const roh = await antwort.text();
  return roh ? JSON.parse(roh) : null;
}

const daten = (pfad, e) => ruf('/rest/v1/' + pfad, e);

/* Jede schreibende Anfrage laesst sich die geschriebenen Zeilen zurueckgeben und
   zaehlt sie nach. Das ist nicht Vorsicht um ihrer selbst willen: der Zeilenschutz
   der Datenbank wirft keinen Fehler, wenn jemand nicht schreiben darf - er laesst
   die Anfrage einfach null Zeilen treffen. Ohne diese Zaehlung meldete das Werkzeug
   „Gespeichert", obwohl nichts geschrieben wurde. Nachgemessen am 27.08.2026. */
async function schreiben(pfad, methode, koerper, mindestens) {
  const einstellungen = { method: methode, headers: { Prefer: 'return=representation' } };
  if (koerper !== undefined) {
    einstellungen.headers['Content-Type'] = 'application/json';
    einstellungen.body = JSON.stringify(koerper);
  }
  const zurueck = await daten(pfad, einstellungen);
  const anzahl = Array.isArray(zurueck) ? zurueck.length : (zurueck ? 1 : 0);
  const soll = (mindestens === undefined) ? 1 : mindestens;
  if (anzahl < soll) {
    throw new Error(anzahl === 0
      ? 'Die Datenbank hat nichts geändert. Das Konto ist vermutlich nicht freigegeben (Tabelle „berechtigt").'
      : ('Nur ' + anzahl + ' von ' + soll + ' Zeilen geschrieben.'));
  }
  return zurueck;
}

/* ── Anmeldung ────────────────────────────────────────────────────────────── */
function sitzungMerken() {
  try { localStorage.setItem(SITZUNG_SCHLUESSEL, JSON.stringify(sitzung)); } catch (e) {}
}
function sitzungVergessen() {
  sitzung = null;
  try { localStorage.removeItem(SITZUNG_SCHLUESSEL); } catch (e) {}
}
function sitzungLesen() {
  try {
    const o = JSON.parse(localStorage.getItem(SITZUNG_SCHLUESSEL) || 'null');
    if (o && o.zugang && o.erneuerung) sitzung = o;
  } catch (e) {}
}

async function anmelden(ereignis) {
  ereignis.preventDefault();
  const knopf = document.getElementById('anmeldeKnopf');
  const kasten = document.getElementById('anmeldeFehler');
  kasten.classList.remove('an');
  knopf.disabled = true; knopf.textContent = 'Anmelden …';
  try {
    const antwort = await ruf('/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        email: document.getElementById('fEmail').value.trim(),
        password: document.getElementById('fKennwort').value
      })
    }, false);
    sitzung = {
      zugang: antwort.access_token,
      erneuerung: antwort.refresh_token,
      ablauf: Date.now() + (antwort.expires_in || 3600) * 1000,
      benutzer: (antwort.user && antwort.user.email) || ''
    };
    sitzungMerken();
    document.getElementById('fKennwort').value = '';
    await starten();
  } catch (fehler) {
    kasten.classList.add('an');
    document.getElementById('anmeldeFehlerText').textContent =
      /invalid/i.test(fehler.message) ? 'E-Mail oder Kennwort stimmen nicht.'
                                      : ('Anmeldung nicht möglich: ' + fehler.message);
  } finally {
    knopf.disabled = false; knopf.textContent = 'Anmelden';
  }
}

async function sitzungErneuern() {
  if (!sitzung) return false;
  try {
    const antwort = await ruf('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: sitzung.erneuerung })
    }, false);
    sitzung.zugang = antwort.access_token;
    sitzung.erneuerung = antwort.refresh_token;
    sitzung.ablauf = Date.now() + (antwort.expires_in || 3600) * 1000;
    sitzungMerken();
    return true;
  } catch (e) { sitzungVergessen(); return false; }
}

function abmelden() {
  if (offeneAenderungen() && !confirm('Es sind Änderungen offen, die noch nicht gespeichert sind.\n\nWirklich abmelden? Die Änderungen gehen verloren.')) return;
  sitzungVergessen();
  URSPRUNG = ARBEIT = null;
  document.getElementById('arbeitSchirm').classList.add('verborgen');
  document.getElementById('kontoBox').classList.add('verborgen');
  document.getElementById('anmeldeSchirm').classList.remove('verborgen');
}

/* ── Laden ────────────────────────────────────────────────────────────────── */
const FELDER =
  'id,jahr,reihenfolge,name,auflage,fachbereich,' +
  'preis(id,reihenfolge,kategorie,format,preis,zuschlag_4c,rabattfaehig,ae_faehig,termin_art,seiten_aequivalent),' +
  'termin(id,reihenfolge,heft,monat,et,anzeigenschluss,du_schluss,eh_termin,themen,kongresse)';

async function ladenAusDatenbank() {
  const zeilen = await daten('titel?select=' + encodeURIComponent(FELDER) +
    '&order=jahr.asc,reihenfolge.asc&preis.order=reihenfolge.asc&termin.order=reihenfolge.asc&limit=500');
  zeilen.forEach(t => {
    t.jahr = String(t.jahr);
    t.preis  = (t.preis  || []).map(p => Object.assign({}, p));
    t.termin = (t.termin || []).map(a => Object.assign({}, a));
  });
  URSPRUNG = zeilen;
  ARBEIT = JSON.parse(JSON.stringify(zeilen));
  try {
    const s = await daten('stand?select=geaendert_am');
    const d = (s && s[0] && s[0].geaendert_am) ? new Date(s[0].geaendert_am) : null;
    const z = n => String(n).padStart(2, '0');
    standText = (d && !isNaN(d)) ? ('Stand ' + z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear()) : '';
  } catch (e) { standText = ''; }
}

async function starten() {
  if (!dbErreichbar()) { meldung('Die Datei konfiguration.js fehlt oder ist unvollständig.', true); return; }
  try {
    if (sitzung && sitzung.ablauf && sitzung.ablauf < Date.now() + 60000) {
      if (!await sitzungErneuern()) { anmeldeSchirmZeigen(); return; }
    }
    await ladenAusDatenbank();
  } catch (fehler) {
    if (fehler.status === 401 && await sitzungErneuern()) { try { await ladenAusDatenbank(); } catch (e) { anmeldeSchirmZeigen(); return; } }
    else { anmeldeSchirmZeigen(); return; }
  }
  document.getElementById('anmeldeSchirm').classList.add('verborgen');
  document.getElementById('arbeitSchirm').classList.remove('verborgen');
  document.getElementById('kontoBox').classList.remove('verborgen');
  document.getElementById('kontoName').textContent = (sitzung && sitzung.benutzer) || '';
  const jahre = jahrgaenge();
  if (!gewJahr || jahre.indexOf(gewJahr) < 0) gewJahr = jahre.includes('2026') ? '2026' : jahre[0];
  jahrAuswahlAufbauen();
  const erste = titelDesJahres()[0];
  gewTitel = erste ? erste.id : null;
  zeichnen();
}

function anmeldeSchirmZeigen() {
  document.getElementById('arbeitSchirm').classList.add('verborgen');
  document.getElementById('kontoBox').classList.add('verborgen');
  document.getElementById('anmeldeSchirm').classList.remove('verborgen');
}

/* ── Hilfen ───────────────────────────────────────────────────────────────── */
function jahrgaenge() {
  return [...new Set((ARBEIT || []).map(t => t.jahr))].sort();
}
function titelDesJahres(jahr) {
  return (ARBEIT || []).filter(t => t.jahr === (jahr || gewJahr))
                       .sort((a, b) => a.reihenfolge - b.reihenfolge);
}
function titelVonId(id) { return (ARBEIT || []).find(t => t.id === id) || null; }

function zahlOderNull(wert) {
  const s = String(wert == null ? '' : wert).trim().replace(',', '.');
  if (s === '') return null;
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}
function zahlText(wert) {
  if (wert == null) return '';
  return String(wert).replace('.', ',');
}
/* Termine: „22.01." oder mit eigener Jahreszahl „04.12.25" / „22.12.2026".
   Leer ist zulaessig — nicht jede Ausgabe fuehrt jeden Termin. */
const TERMIN_MUSTER = /^(\d{1,2})\.(\d{1,2})\.(\d{2}|\d{4})?$/;
function terminGueltig(wert) {
  const s = String(wert || '').trim();
  if (s === '') return true;
  const m = s.match(TERMIN_MUSTER);
  if (!m) return false;
  const tag = Number(m[1]), monat = Number(m[2]);
  return tag >= 1 && tag <= 31 && monat >= 1 && monat <= 12;
}

function meldung(text, schlecht) {
  const alt = document.querySelector('.meldung');
  if (alt) alt.remove();
  const d = document.createElement('div');
  d.className = 'meldung' + (schlecht ? ' schlecht' : '');
  d.textContent = text;
  document.body.appendChild(d);
  setTimeout(() => d.remove(), schlecht ? 6000 : 3200);
}

/* ── Änderungen erkennen ──────────────────────────────────────────────────── */
function gleich(a, b) { return JSON.stringify(a) === JSON.stringify(b); }

function ursprungTitel(id) { return (URSPRUNG || []).find(t => t.id === id) || null; }

function titelGeaendert(t) {
  const u = ursprungTitel(t.id);
  if (!u) return true;
  if (u.name !== t.name || u.auflage !== t.auflage || u.fachbereich !== t.fachbereich) return true;
  if (!gleich(u.preis, t.preis)) return true;
  if (!gleich(u.termin, t.termin)) return true;
  return false;
}
function offeneAenderungen() {
  if (!ARBEIT || !URSPRUNG) return false;
  if (ARBEIT.length !== URSPRUNG.length) return true;
  return ARBEIT.some(titelGeaendert);
}

function knoepfeAuffrischen() {
  const offen = offeneAenderungen();
  const fehler = alleFehler();
  document.getElementById('speichernKnopf').disabled = !offen || fehler.length > 0;
  document.getElementById('verwerfenKnopf').disabled = !offen;
  const hinweis = document.getElementById('offenHinweis');
  hinweis.classList.toggle('an', offen);
  hinweis.textContent = offen ? 'Änderungen offen' : '';
  const kasten = document.getElementById('pruefKasten');
  kasten.classList.toggle('an', fehler.length > 0);
  if (fehler.length) {
    document.getElementById('pruefText').textContent =
      fehler.length === 1 ? fehler[0] : (fehler.length + ' Angaben stimmen noch nicht: ' + fehler.slice(0, 3).join(' · ') + (fehler.length > 3 ? ' …' : ''));
  }
}

/* ── Prüfung ──────────────────────────────────────────────────────────────── */
function alleFehler() {
  const fehler = [];
  (ARBEIT || []).forEach(t => {
    const gesehen = new Set();
    (t.preis || []).forEach(p => {
      const wo = t.name + ' · ' + (p.format || '(ohne Format)');
      if (!String(p.format || '').trim()) fehler.push(t.name + ': ein Format ohne Namen');
      const schl = (p.kategorie || '') + '|' + (p.format || '');
      if (gesehen.has(schl)) fehler.push(wo + ': steht zweimal in derselben Kategorie');
      gesehen.add(schl);
      if (isNaN(zahlOderNull(p.preis)))       fehler.push(wo + ': Preis ist keine Zahl');
      if (isNaN(zahlOderNull(p.zuschlag_4c))) fehler.push(wo + ': 4c-Zuschlag ist keine Zahl');
      const eq = zahlOderNull(p.seiten_aequivalent);
      if (isNaN(eq) || (eq != null && eq <= 0)) fehler.push(wo + ': Seiten-Äquivalent muss größer als 0 sein');
    });
    const hefte = new Set();
    (t.termin || []).forEach(a => {
      const wo = t.name + ' · Heft ' + (a.heft || '?');
      if (!String(a.heft || '').trim()) fehler.push(t.name + ': eine Ausgabe ohne Heftnummer');
      if (hefte.has(a.heft)) fehler.push(wo + ': Heftnummer steht zweimal');
      hefte.add(a.heft);
      [['et', 'ET'], ['anzeigenschluss', 'Anzeigenschluss'], ['du_schluss', 'DU-Schluss'], ['eh_termin', 'EH-Termin']]
        .forEach(([feld, name]) => { if (!terminGueltig(a[feld])) fehler.push(wo + ': ' + name + ' muss TT.MM. sein'); });
    });
  });
  return fehler;
}

/* ── Zeichnen ─────────────────────────────────────────────────────────────── */
function jahrAuswahlAufbauen() {
  const s = document.getElementById('jahrWahl');
  s.innerHTML = jahrgaenge().map(j => '<option value="' + j + '"' + (j === gewJahr ? ' selected' : '') + '>' + j + '</option>').join('');
}

function jahrWechseln(jahr) {
  gewJahr = jahr;
  const erste = titelDesJahres()[0];
  gewTitel = erste ? erste.id : null;
  zeichnen();
}
function reiterWechseln(welcher) {
  reiter = welcher;
  document.getElementById('reiterPreise').classList.toggle('an', welcher === 'preise');
  document.getElementById('reiterTermine').classList.toggle('an', welcher === 'termine');
  zeichnen();
}
function titelWaehlen(id) { gewTitel = id; zeichnen(); }

function esc(s) {
  return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function zeichnen() {
  document.getElementById('standHinweis').textContent = standText;
  titellisteZeichnen();
  inhaltZeichnen();
  knoepfeAuffrischen();
}

function titellisteZeichnen() {
  const liste = document.getElementById('titelListe');
  const merkeRollen = liste.scrollTop;
  const titel = titelDesJahres();
  const nachFach = {};
  titel.forEach(t => { const f = t.fachbereich || 'Ohne Fachbereich'; (nachFach[f] = nachFach[f] || []).push(t); });
  let html = '';
  Object.keys(nachFach).forEach(fach => {
    html += '<div class="fach-kopf">' + esc(fach) + '</div>';
    nachFach[fach].forEach(t => {
      const ohnePreis = (t.preis || []).filter(p => p.preis == null || Number(p.preis) === 0).length;
      const zusatz = reiter === 'preise'
        ? (ohnePreis ? '<span class="offen">' + ohnePreis + ' offen</span>'
                     : '<span class="zahl">' + (t.preis || []).length + '</span>')
        : '<span class="zahl">' + (t.termin || []).length + '</span>';
      html += '<div class="titel-zeile' + (t.id === gewTitel ? ' an' : '') + '" onclick="titelWaehlen(\'' + t.id + '\')">' +
              '<span>' + esc(t.name) + (titelGeaendert(t) ? ' <span class="geaendert">•</span>' : '') + '</span>' + zusatz + '</div>';
    });
  });
  liste.innerHTML = html || '<div class="fach-kopf">Keine Titel in diesem Jahrgang</div>';
  liste.scrollTop = merkeRollen;
}

function inhaltZeichnen() {
  const ziel = document.getElementById('inhalt');
  const t = titelVonId(gewTitel);
  if (!t) { ziel.innerHTML = '<div class="leer-zeile">Kein Titel gewählt.</div>'; return; }
  const anzahl = reiter === 'preise' ? (t.preis || []).length : (t.termin || []).length;
  let html = '<div class="inhalt-kopf"><h2>' + esc(t.name) + '</h2>' +
             '<span class="neben">Jahrgang ' + esc(t.jahr) + ' · ' + anzahl +
             (reiter === 'preise' ? ' Formate' : ' Ausgaben') + '</span></div>';

  html += '<div class="stamm">' +
    '<div class="feld"><label>Titel</label><input style="width:250px" value="' + esc(t.name) + '" onchange="stammSetzen(\'name\',this.value)"></div>' +
    '<div class="feld"><label>Auflage</label><input class="zahl" style="width:92px;text-align:right" value="' + esc(t.auflage) + '" onchange="stammSetzen(\'auflage\',this.value)"></div>' +
    '<div class="feld"><label>Fachbereich</label><input style="width:150px" list="fachListe" value="' + esc(t.fachbereich) + '" onchange="stammSetzen(\'fachbereich\',this.value)"></div>' +
    '<datalist id="fachListe">' + [...new Set((ARBEIT || []).map(x => x.fachbereich).filter(Boolean))].map(f => '<option value="' + esc(f) + '">').join('') + '</datalist>' +
    '</div>';

  html += reiter === 'preise' ? preiseZeichnen(t) : termineZeichnen(t);
  ziel.innerHTML = html;
}

function preiseZeichnen(t) {
  const liste = t.preis || [];
  if (!liste.length) return '<table><tr class="leer-zeile"><td>Noch keine Formate hinterlegt.</td></tr></table>' + neuKnopf('Format');
  const nachKat = [];
  liste.forEach(p => {
    let g = nachKat.find(x => x.kat === p.kategorie);
    if (!g) { g = { kat: p.kategorie, zeilen: [] }; nachKat.push(g); }
    g.zeilen.push(p);
  });
  let html = '';
  nachKat.forEach(g => {
    html += '<div class="kat-kopf"><span>' + esc(g.kat) + '</span><span>' + g.zeilen.length + '</span></div>';
    html += '<table><colgroup><col style="width:34%"><col style="width:13%"><col style="width:13%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%"><col style="width:36px"></colgroup>' +
      '<tr><th>Format</th><th class="r">Preis €</th><th class="r">4c-Zuschlag €</th><th>rabatt</th><th>AE</th><th>Termin</th><th class="r">Seiten-Äqu.</th><th></th></tr>';
    g.zeilen.forEach(p => {
      const u = ursprungPreis(t, p.id);
      const anders = feld => (!u || String(u[feld] == null ? '' : u[feld]) !== String(p[feld] == null ? '' : p[feld])) ? ' class="geaendert"' : '';
      html += '<tr>' +
        '<td' + anders('format') + '><input value="' + esc(p.format) + '" onchange="preisSetzen(\'' + p.id + '\',\'format\',this.value)"></td>' +
        '<td class="r"' + (anders('preis') ? ' class="r geaendert"' : '') + '><input class="zahl' + (isNaN(zahlOderNull(p.preis)) ? ' fehler' : '') + '" value="' + esc(zahlText(p.preis)) + '" onchange="preisSetzen(\'' + p.id + '\',\'preis\',this.value)"></td>' +
        '<td class="r"><input class="zahl' + (isNaN(zahlOderNull(p.zuschlag_4c)) ? ' fehler' : '') + '" value="' + esc(zahlText(p.zuschlag_4c)) + '" onchange="preisSetzen(\'' + p.id + '\',\'zuschlag_4c\',this.value)"></td>' +
        '<td>' + jaNein(p.id, 'rabattfaehig', p.rabattfaehig) + '</td>' +
        '<td>' + jaNein(p.id, 'ae_faehig', p.ae_faehig) + '</td>' +
        '<td><select onchange="preisSetzen(\'' + p.id + '\',\'termin_art\',this.value)">' +
          ['', 'DU', 'EH'].map(w => '<option value="' + w + '"' + ((p.termin_art || '') === w ? ' selected' : '') + '>' + (w || '—') + '</option>').join('') +
        '</select></td>' +
        '<td class="r"><input class="zahl" placeholder="auto" value="' + esc(zahlText(p.seiten_aequivalent)) + '" onchange="preisSetzen(\'' + p.id + '\',\'seiten_aequivalent\',this.value)"></td>' +
        '<td><button class="zeilen-x" title="Format entfernen" onclick="preisEntfernen(\'' + p.id + '\')">×</button></td>' +
      '</tr>';
    });
    html += '</table>';
  });
  return html + neuKnopf('Format');
}

function jaNein(id, feld, wert) {
  return '<select onchange="preisSetzen(\'' + id + '\',\'' + feld + '\',this.value)">' +
    '<option value="ja"' + (wert ? ' selected' : '') + '>ja</option>' +
    '<option value="nein"' + (wert ? '' : ' selected') + '>nein</option></select>';
}

function termineZeichnen(t) {
  const liste = t.termin || [];
  if (!liste.length) return '<table><tr class="leer-zeile"><td>Noch keine Ausgaben hinterlegt.</td></tr></table>' + neuKnopf('Ausgabe');
  /* Zwei Zeilen je Ausgabe. Die Termine stehen nebeneinander, damit sie sich
     überfliegen lassen; Themenschwerpunkte und Kongresse bekommen darunter die
     ganze Breite. In einer Spalte von 190 Pixeln waren sie nicht zu bearbeiten -
     man sah nur den Anfang. */
  let html = '<table class="termin-tab"><colgroup><col style="width:64px"><col style="width:112px"><col style="width:92px"><col style="width:110px"><col style="width:104px"><col style="width:104px"><col><col style="width:34px"></colgroup>' +
    '<tr><th>Heft</th><th>Monat</th><th>ET</th><th>Anz.-schluss</th><th>DU-Schluss</th><th>EH-Termin</th><th></th><th></th></tr>';
  liste.forEach(a => {
    const f = feld => terminGueltig(a[feld]) ? '' : ' fehler';
    html += '<tr class="termin-oben">' +
      '<td><input value="' + esc(a.heft) + '" onchange="terminSetzen(\'' + a.id + '\',\'heft\',this.value)"></td>' +
      '<td><input value="' + esc(a.monat) + '" onchange="terminSetzen(\'' + a.id + '\',\'monat\',this.value)"></td>' +
      '<td><input class="' + f('et') + '" value="' + esc(a.et) + '" onchange="terminSetzen(\'' + a.id + '\',\'et\',this.value)"></td>' +
      '<td><input class="' + f('anzeigenschluss') + '" value="' + esc(a.anzeigenschluss) + '" onchange="terminSetzen(\'' + a.id + '\',\'anzeigenschluss\',this.value)"></td>' +
      '<td><input class="' + f('du_schluss') + '" value="' + esc(a.du_schluss) + '" onchange="terminSetzen(\'' + a.id + '\',\'du_schluss\',this.value)"></td>' +
      '<td><input class="' + f('eh_termin') + '" value="' + esc(a.eh_termin) + '" onchange="terminSetzen(\'' + a.id + '\',\'eh_termin\',this.value)"></td>' +
      '<td></td>' +
      '<td><button class="zeilen-x" title="Ausgabe entfernen" onclick="terminEntfernen(\'' + a.id + '\')">×</button></td>' +
    '</tr>' +
    '<tr class="termin-unten"><td class="marke">Thema</td><td colspan="3">' +
      '<input value="' + esc(a.themen) + '" placeholder="Themenschwerpunkt dieser Ausgabe" onchange="terminSetzen(\'' + a.id + '\',\'themen\',this.value)"></td>' +
      '<td class="marke">Kongresse</td><td colspan="3">' +
      '<input value="' + esc((a.kongresse || '').replace(/\n/g, ' ⏎ ')) + '" placeholder="mehrere mit ⏎ trennen" onchange="terminSetzen(\'' + a.id + '\',\'kongresse\',this.value)"></td>' +
    '</tr>';
  });
  html += '</table>';
  html += '<div class="fehlertext" style="color:var(--grey-600)">Termine in der Form <b>TT.MM.</b> — der Jahrgang wird von den Werkzeugen ergänzt. Fällt ein Termin ins Vor- oder Folgejahr, die Jahreszahl mitschreiben: <b>22.12.2026</b>. Mehrere Kongresse mit ⏎ trennen.</div>';
  return html + neuKnopf('Ausgabe');
}

function neuKnopf(was) {
  return '<div class="neu-zeile"><button class="btn" onclick="' +
    (was === 'Format' ? 'preisAnlegen()' : 'terminAnlegen()') + '">+ ' + was + ' anlegen</button></div>';
}

function ursprungPreis(t, id) {
  const u = ursprungTitel(t.id);
  return u ? (u.preis || []).find(p => p.id === id) || null : null;
}

/* ── Ändern ───────────────────────────────────────────────────────────────── */
function stammSetzen(feld, wert) {
  const t = titelVonId(gewTitel); if (!t) return;
  t[feld] = feld === 'auflage' ? (parseInt(String(wert).replace(/\D/g, ''), 10) || 0) : String(wert).trim();
  zeichnen();
}
function preisSetzen(id, feld, wert) {
  const t = titelVonId(gewTitel); if (!t) return;
  const p = (t.preis || []).find(x => x.id === id); if (!p) return;
  if (feld === 'rabattfaehig' || feld === 'ae_faehig') p[feld] = (wert === 'ja');
  else if (feld === 'preis' || feld === 'zuschlag_4c' || feld === 'seiten_aequivalent') {
    const n = zahlOderNull(wert);
    p[feld] = isNaN(n) ? String(wert) : n;   /* unbrauchbare Eingabe bleibt stehen, damit die Prüfung sie zeigt */
  }
  else if (feld === 'termin_art') p[feld] = wert || null;
  else p[feld] = String(wert).trim();
  zeichnen();
}
function terminSetzen(id, feld, wert) {
  const t = titelVonId(gewTitel); if (!t) return;
  const a = (t.termin || []).find(x => x.id === id); if (!a) return;
  a[feld] = feld === 'kongresse' ? String(wert).split('⏎').map(s => s.trim()).filter(Boolean).join('\n') : String(wert).trim();
  zeichnen();
}
function preisEntfernen(id) {
  const t = titelVonId(gewTitel); if (!t) return;
  const p = (t.preis || []).find(x => x.id === id);
  if (!p) return;
  if (!confirm('Format „' + (p.format || '') + '" aus der Preisliste entfernen?\n\nWirksam wird das erst mit „Speichern".')) return;
  t.preis = t.preis.filter(x => x.id !== id);
  zeichnen();
}
function terminEntfernen(id) {
  const t = titelVonId(gewTitel); if (!t) return;
  const a = (t.termin || []).find(x => x.id === id);
  if (!a) return;
  if (!confirm('Ausgabe „Heft ' + (a.heft || '') + '" entfernen?\n\nWirksam wird das erst mit „Speichern".')) return;
  t.termin = t.termin.filter(x => x.id !== id);
  zeichnen();
}
let neuZaehler = 0;
function neueKennung() { return 'neu-' + (++neuZaehler); }
function preisAnlegen() {
  const t = titelVonId(gewTitel); if (!t) return;
  const letzte = (t.preis || [])[t.preis.length - 1];
  t.preis = t.preis || [];
  t.preis.push({ id: neueKennung(), reihenfolge: t.preis.length + 1,
    kategorie: letzte ? letzte.kategorie : 'Normalplatzierungen', format: '',
    preis: null, zuschlag_4c: null, rabattfaehig: true, ae_faehig: true,
    termin_art: letzte ? letzte.termin_art : null, seiten_aequivalent: null });
  zeichnen();
}
function terminAnlegen() {
  const t = titelVonId(gewTitel); if (!t) return;
  t.termin = t.termin || [];
  t.termin.push({ id: neueKennung(), reihenfolge: t.termin.length + 1,
    heft: String(t.termin.length + 1), monat: '', et: '', anzeigenschluss: '',
    du_schluss: '', eh_termin: '', themen: '', kongresse: '' });
  zeichnen();
}

function aenderungenVerwerfen() {
  if (!confirm('Alle offenen Änderungen verwerfen?\n\nDer zuletzt gespeicherte Stand wird wiederhergestellt.')) return;
  ARBEIT = JSON.parse(JSON.stringify(URSPRUNG));
  if (!titelVonId(gewTitel)) { const e = titelDesJahres()[0]; gewTitel = e ? e.id : null; }
  zeichnen();
  meldung('Änderungen verworfen.');
}

/* ── Speichern ────────────────────────────────────────────────────────────── */
const PREIS_FELDER  = ['reihenfolge', 'kategorie', 'format', 'preis', 'zuschlag_4c', 'rabattfaehig', 'ae_faehig', 'termin_art', 'seiten_aequivalent'];
const TERMIN_FELDER = ['reihenfolge', 'heft', 'monat', 'et', 'anzeigenschluss', 'du_schluss', 'eh_termin', 'themen', 'kongresse'];

function nurFelder(zeile, felder) {
  const o = {};
  felder.forEach(f => { o[f] = zeile[f] === '' && (f === 'preis' || f === 'zuschlag_4c' || f === 'seiten_aequivalent' || f === 'termin_art') ? null : zeile[f]; });
  return o;
}
function istNeu(id) { return String(id).startsWith('neu-'); }

async function speichern() {
  const fehler = alleFehler();
  if (fehler.length) { meldung('Erst die beanstandeten Angaben berichtigen.', true); return; }
  const knopf = document.getElementById('speichernKnopf');
  knopf.disabled = true; knopf.textContent = 'Speichern …';
  try {
    if (sitzung && sitzung.ablauf && sitzung.ablauf < Date.now() + 60000) await sitzungErneuern();
    let n = 0;
    for (const t of ARBEIT) {
      const u = ursprungTitel(t.id);
      if (!u) continue;
      if (u.name !== t.name || u.auflage !== t.auflage || u.fachbereich !== t.fachbereich) {
        await schreiben('titel?id=eq.' + t.id, 'PATCH',
          { name: t.name, auflage: t.auflage, fachbereich: t.fachbereich });
        n++;
      }
      n += await zeilenSchreiben('preis',  t, u, 'preis',  PREIS_FELDER);
      n += await zeilenSchreiben('termin', t, u, 'termin', TERMIN_FELDER);
    }
    await ladenAusDatenbank();
    if (!titelVonId(gewTitel)) { const e = titelDesJahres()[0]; gewTitel = e ? e.id : null; }
    zeichnen();
    meldung(n === 0 ? 'Nichts zu speichern.' : ('Gespeichert — ' + n + (n === 1 ? ' Änderung' : ' Änderungen') + ' stehen jetzt in allen Werkzeugen.'));
  } catch (fehler) {
    meldung('Nicht gespeichert: ' + fehler.message, true);
  } finally {
    knopf.textContent = 'Speichern';
    knoepfeAuffrischen();
  }
}

async function zeilenSchreiben(tabelle, t, u, feldname, felder) {
  let n = 0;
  const neu = (t[feldname] || []), alt = (u[feldname] || []);
  const altIds = new Set(alt.map(z => z.id));
  const neuIds = new Set(neu.map(z => z.id));

  for (const z of alt) {
    if (!neuIds.has(z.id)) { await schreiben(tabelle + '?id=eq.' + z.id, 'DELETE'); n++; }
  }
  const anzulegen = [];
  for (let i = 0; i < neu.length; i++) {
    const z = neu[i];
    z.reihenfolge = i + 1;
    if (istNeu(z.id) || !altIds.has(z.id)) { anzulegen.push(Object.assign({ titel_id: t.id }, nurFelder(z, felder))); continue; }
    const a = alt.find(x => x.id === z.id);
    if (!gleich(nurFelder(a, felder), nurFelder(z, felder))) {
      await schreiben(tabelle + '?id=eq.' + z.id, 'PATCH', nurFelder(z, felder));
      n++;
    }
  }
  if (anzulegen.length) {
    await schreiben(tabelle, 'POST', anzulegen, anzulegen.length);
    n += anzulegen.length;
  }
  return n;
}

/* ── Preisrunde ───────────────────────────────────────────────────────────────
   Der Kraftakt des Jahres: ein Jahrgang bekommt neue Preise. Sie werden selten
   einzeln erfunden, sondern aus dem Vorjahr fortgeschrieben - 2026 auf 2027
   waren es durchgehend 3,0 %. Von Hand nachgebessert wird danach.

   Zur Rundung: die allermeisten Preise stehen auf vollen fuenf Euro (890 von
   899). Die Ausnahmen sind gerechnete Werte - Werbebeilagen „(gesamt)" und ein
   Ein-/Durchhefter. Deshalb wird nicht stur gerundet, sondern nur dort, wo der
   Ausgangspreis selbst auf der Rundungsstufe stand. Was schon vorher krumm war,
   bleibt es. */
function preisrundeOeffnen() {
  const jahre = jahrgaenge();
  /* Vorlage ist der juengste Jahrgang, der ueberhaupt Preise fuehrt - nicht schlicht
     der juengste. Sonst stuende beim Oeffnen ein leeres Geruestjahr als Vorlage da
     und die Vorschau meldete „0 Preise". */
  const mitPreisen = jahre.filter(j => (ARBEIT || []).some(t => t.jahr === j &&
    (t.preis || []).some(p => { const w = zahlOderNull(p.preis); return w != null && !isNaN(w) && w > 0; })));
  const vorgabe = mitPreisen.length ? mitPreisen[mitPreisen.length - 1] : jahre[jahre.length - 1];
  dialogZeigen(
    '<h3>Preise aus einem Jahrgang fortschreiben</h3>' +
    '<div class="erklaerung">Die Preise des Vorlagejahrgangs werden übernommen und angepasst. ' +
    'Nachbessern lässt sich anschließend jede Zeile.</div>' +
    '<div class="dialog-zeile"><span>Vorlage</span><select id="prVorlage" onchange="preisrundeRechnen()">' +
      jahre.map(j => '<option' + (j === vorgabe ? ' selected' : '') + '>' + j + '</option>').join('') +
    '</select></div>' +
    '<div class="dialog-zeile"><span>Zieljahrgang</span><input id="prZiel" class="kurz" value="' + (Number(vorgabe) + 1) + '" oninput="preisrundeRechnen()"></div>' +
    '<div class="dialog-zeile"><span>Anpassung</span><span><input id="prProzent" class="kurz" value="3,0" oninput="preisrundeRechnen()"> %</span></div>' +
    '<div class="dialog-zeile"><span>Rundung</span><select id="prRundung" onchange="preisrundeRechnen()">' +
      '<option value="5">auf volle 5 €</option><option value="1">auf volle 1 €</option><option value="0">nicht runden</option>' +
    '</select></div>' +
    '<div class="dialog-zeile"><span>Umfang</span><select id="prFach" onchange="preisrundeRechnen()">' +
      '<option value="">alle Fachbereiche</option>' +
      [...new Set((ARBEIT || []).map(t => t.fachbereich).filter(Boolean))].map(f => '<option value="' + esc(f) + '">' + esc(f) + '</option>').join('') +
    '</select></div>' +
    '<div class="dialog-summe" id="prSumme"></div>' +
    '<div class="dialog-knoepfe">' +
      '<button class="btn" onclick="dialogSchliessen()">Abbrechen</button>' +
      '<button class="btn btn-primär" id="prKnopf" onclick="preisrundeAusfuehren()">Anlegen und ansehen</button>' +
    '</div>');
  preisrundeRechnen();
}

function preisrundeStufe(wert, stufe, quelle) {
  if (!stufe) return Math.round(wert * 100) / 100;
  /* Gerechnete Werte behalten ihre Form: was im Vorjahr nicht auf der Stufe stand,
     wird auch jetzt nicht darauf gezwungen. */
  if (Math.abs(quelle % stufe) > 1e-9) return Math.round(wert * 100) / 100;
  return Math.round(wert / stufe) * stufe;
}

function preisrundeVorschau() {
  const vorlage = document.getElementById('prVorlage').value;
  const ziel    = String(document.getElementById('prZiel').value || '').trim();
  const prozent = zahlOderNull(document.getElementById('prProzent').value);
  const stufe   = Number(document.getElementById('prRundung').value);
  const fach    = document.getElementById('prFach').value;
  const quellen = (ARBEIT || []).filter(t => t.jahr === vorlage && (!fach || t.fachbereich === fach));
  let mitPreis = 0, ohnePreis = 0;
  quellen.forEach(t => (t.preis || []).forEach(p => {
    const w = zahlOderNull(p.preis);
    if (w == null || isNaN(w) || w === 0) ohnePreis++; else mitPreis++;
  }));
  return { vorlage, ziel, prozent, stufe, fach, quellen, mitPreis, ohnePreis };
}

function preisrundeRechnen() {
  const v = preisrundeVorschau();
  const kasten = document.getElementById('prSumme');
  const knopf  = document.getElementById('prKnopf');
  if (!kasten) return;
  let text = '', gesperrt = false;
  if (!/^\d{4}$/.test(v.ziel)) { text = 'Der Zieljahrgang muss eine vierstellige Jahreszahl sein.'; gesperrt = true; }
  else if (v.prozent == null || isNaN(v.prozent)) { text = 'Die Anpassung muss eine Zahl sein.'; gesperrt = true; }
  else if (!v.quellen.length) { text = 'Der Vorlagejahrgang enthält keine Titel dieses Umfangs.'; gesperrt = true; }
  else {
    const vorhanden = (ARBEIT || []).some(t => t.jahr === v.ziel && (!v.fach || t.fachbereich === v.fach) && (t.preis || []).length);
    const bsp = beispielPreis(v);
    text = '<b>' + v.mitPreis + ' Preise</b> werden angelegt · ' + v.quellen.length + ' Titel · ' +
           v.ohnePreis + ' Zeilen ohne Preis bleiben leer';
    if (bsp) text += '<br>Beispiel: ' + esc(bsp.was) + ' ' + bsp.alt.toLocaleString('de-DE') + ' € → <b>' + bsp.neu.toLocaleString('de-DE') + ' €</b>';
    if (vorhanden) text += '<br><b>Achtung:</b> Der Jahrgang ' + esc(v.ziel) + ' führt bereits Preiszeilen — sie werden ersetzt, auch die von Hand gepflegten. Vorher entsteht ohne Zutun ein Sicherungspunkt.';
  }
  kasten.innerHTML = text;
  knopf.disabled = gesperrt;
}

function beispielPreis(v) {
  for (const t of v.quellen) {
    for (const p of (t.preis || [])) {
      const w = zahlOderNull(p.preis);
      if (w != null && !isNaN(w) && w > 0) {
        return { was: t.name + ' · ' + p.format, alt: w, neu: preisrundeStufe(w * (1 + v.prozent / 100), v.stufe, w) };
      }
    }
  }
  return null;
}

async function preisrundeAusfuehren() {
  const v = preisrundeVorschau();
  if (offeneAenderungen() && !confirm('Es sind Änderungen offen, die noch nicht gespeichert sind.\n\nDie Preisrunde schreibt unmittelbar in die Datenbank. Offene Änderungen gehen dabei verloren.\n\nTrotzdem fortfahren?')) return;
  const knopf = document.getElementById('prKnopf');
  knopf.disabled = true; knopf.textContent = 'Wird angelegt …';
  try {
    if (sitzung && sitzung.ablauf && sitzung.ablauf < Date.now() + 60000) await sitzungErneuern();

    const zielVorhanden = (ARBEIT || []).some(t => t.jahr === v.ziel);
    if (zielVorhanden) await sicherungAnlegen(v.ziel, 'vor der Preisrunde ' + v.prozent + ' %', true);
    else await schreiben('jahrgang', 'POST', { jahr: v.ziel });

    for (const q of v.quellen) {
      let zielTitel = (ARBEIT || []).find(t => t.jahr === v.ziel && t.name === q.name);
      if (!zielTitel) {
        const angelegt = await schreiben('titel', 'POST',
          { jahr: v.ziel, reihenfolge: q.reihenfolge, name: q.name, auflage: q.auflage, fachbereich: q.fachbereich });
        zielTitel = { id: angelegt[0].id };
      } else if ((zielTitel.preis || []).length) {
        await schreiben('preis?titel_id=eq.' + zielTitel.id, 'DELETE');
      }
      const neu = (q.preis || []).map((p, i) => {
        const w = zahlOderNull(p.preis);
        const hat = (w != null && !isNaN(w) && w > 0);
        return {
          titel_id: zielTitel.id, reihenfolge: i + 1, kategorie: p.kategorie, format: p.format,
          preis: hat ? preisrundeStufe(w * (1 + v.prozent / 100), v.stufe, w) : null,
          zuschlag_4c: (() => { const z = zahlOderNull(p.zuschlag_4c); return (z != null && !isNaN(z) && z > 0) ? preisrundeStufe(z * (1 + v.prozent / 100), v.stufe, z) : null; })(),
          rabattfaehig: !!p.rabattfaehig, ae_faehig: !!p.ae_faehig,
          termin_art: p.termin_art || null,
          seiten_aequivalent: (p.seiten_aequivalent == null ? null : Number(p.seiten_aequivalent))
        };
      });
      for (let i = 0; i < neu.length; i += 250) {
        const teil = neu.slice(i, i + 250);
        await schreiben('preis', 'POST', teil, teil.length);
      }
    }
    dialogSchliessen();
    await ladenAusDatenbank();
    gewJahr = v.ziel;
    jahrAuswahlAufbauen();
    const erste = titelDesJahres()[0];
    gewTitel = erste ? erste.id : null;
    reiterWechseln('preise');
    meldung('Jahrgang ' + v.ziel + ' angelegt — ' + v.mitPreis + ' Preise fortgeschrieben.');
  } catch (fehler) {
    meldung('Preisrunde nicht ausgeführt: ' + fehler.message, true);
    knopf.disabled = false; knopf.textContent = 'Anlegen und ansehen';
  }
}

/* ── Sicherungspunkte ─────────────────────────────────────────────────────────
   Ein Schnappschuss des ganzen Jahrgangs als ein Block. Bewusst nicht
   aufgeloest: eine Sicherung soll genau den Stand zurueckbringen, der beim
   Anlegen galt - auch dann, wenn sich das Schema seither geaendert hat. */
async function sicherungAnlegen(jahr, bezeichnung, still) {
  const titel = (ARBEIT || []).filter(t => t.jahr === jahr).map(t => ({
    reihenfolge: t.reihenfolge, name: t.name, auflage: t.auflage, fachbereich: t.fachbereich,
    preise: (t.preis || []).map(p => nurFelder(p, PREIS_FELDER)),
    termine: (t.termin || []).map(a => nurFelder(a, TERMIN_FELDER))
  }));
  await schreiben('sicherung', 'POST', { jahr: jahr, bezeichnung: bezeichnung || '', inhalt: { titel } });
  if (!still) meldung('Sicherungspunkt angelegt.');
}

async function sicherungenOeffnen() {
  dialogZeigen('<h3>Sicherungspunkte</h3><div class="erklaerung">Schnappschüsse des Jahrgangs ' + esc(gewJahr) +
    '. Beim Zurückspielen werden Titel, Preise und Termine dieses Jahrgangs ersetzt.</div>' +
    '<div class="dialog-liste" id="sichListe"><div class="dialog-zeile"><span>wird geladen …</span></div></div>' +
    '<div class="dialog-knoepfe">' +
      '<button class="btn" onclick="dialogSchliessen()">Schließen</button>' +
      '<button class="btn btn-primär" onclick="sicherungJetztAnlegen()">Sicherungspunkt anlegen</button>' +
    '</div>');
  await sicherungenLaden();
}

async function sicherungenLaden() {
  const ziel = document.getElementById('sichListe');
  try {
    const liste = await daten('sicherung?select=id,bezeichnung,erstellt_am&jahr=eq.' + encodeURIComponent(gewJahr) + '&order=erstellt_am.desc&limit=40');
    if (!liste.length) { ziel.innerHTML = '<div class="dialog-zeile"><span>Noch keine Sicherungspunkte für diesen Jahrgang.</span></div>'; return; }
    ziel.innerHTML = liste.map(s => {
      const d = new Date(s.erstellt_am), z = n => String(n).padStart(2, '0');
      const wann = z(d.getDate()) + '.' + z(d.getMonth() + 1) + '.' + d.getFullYear() + ', ' + z(d.getHours()) + ':' + z(d.getMinutes());
      return '<div class="eintrag"><div><b>' + esc(s.bezeichnung || 'ohne Bezeichnung') + '</b><br><span>' + wann + '</span></div>' +
        '<span style="display:flex;gap:6px">' +
        '<button class="btn" onclick="sicherungZurueck(\'' + s.id + '\',\'' + esc(wann) + '\')">Zurückspielen</button>' +
        '<button class="btn btn-gefahr" onclick="sicherungEntfernen(\'' + s.id + '\')">Entfernen</button></span></div>';
    }).join('');
  } catch (fehler) { ziel.innerHTML = '<div class="dialog-zeile"><span>Nicht geladen: ' + esc(fehler.message) + '</span></div>'; }
}

async function sicherungJetztAnlegen() {
  const bezeichnung = prompt('Bezeichnung des Sicherungspunkts (darf leer bleiben):', 'Stand ' + new Date().toLocaleDateString('de-DE'));
  if (bezeichnung === null) return;
  try { await sicherungAnlegen(gewJahr, bezeichnung); await sicherungenLaden(); }
  catch (fehler) { meldung('Nicht angelegt: ' + fehler.message, true); }
}

async function sicherungEntfernen(id) {
  if (!confirm('Diesen Sicherungspunkt endgültig entfernen?')) return;
  try { await schreiben('sicherung?id=eq.' + id, 'DELETE'); await sicherungenLaden(); }
  catch (fehler) { meldung('Nicht entfernt: ' + fehler.message, true); }
}

async function sicherungZurueck(id, wann) {
  if (!confirm('Den Jahrgang ' + gewJahr + ' auf den Stand vom ' + wann + ' zurücksetzen?\n\nTitel, Preise und Termine dieses Jahrgangs werden ersetzt. Alles seither Geänderte geht verloren.')) return;
  try {
    if (sitzung && sitzung.ablauf && sitzung.ablauf < Date.now() + 60000) await sitzungErneuern();
    const s = await daten('sicherung?select=inhalt&id=eq.' + id);
    const inhalt = s && s[0] && s[0].inhalt;
    if (!inhalt || !Array.isArray(inhalt.titel)) throw new Error('Der Sicherungspunkt ist unlesbar.');
    /* Erst die Titel des Jahrgangs entfernen - Preise und Termine haengen daran und
       gehen mit. Dann alles aus dem Schnappschuss neu anlegen. */
    await schreiben('titel?jahr=eq.' + encodeURIComponent(gewJahr), 'DELETE');
    for (const t of inhalt.titel) {
      const angelegt = await schreiben('titel', 'POST',
        { jahr: gewJahr, reihenfolge: t.reihenfolge, name: t.name, auflage: t.auflage, fachbereich: t.fachbereich });
      const tid = angelegt[0].id;
      const preise  = (t.preise  || []).map(p => Object.assign({ titel_id: tid }, p));
      const termine = (t.termine || []).map(a => Object.assign({ titel_id: tid }, a));
      for (let i = 0; i < preise.length; i += 250) {
        const teil = preise.slice(i, i + 250);
        await schreiben('preis', 'POST', teil, teil.length);
      }
      if (termine.length) await schreiben('termin', 'POST', termine, termine.length);
    }
    dialogSchliessen();
    await ladenAusDatenbank();
    const erste = titelDesJahres()[0];
    gewTitel = erste ? erste.id : null;
    zeichnen();
    meldung('Jahrgang ' + gewJahr + ' auf den Stand vom ' + wann + ' zurückgesetzt.');
  } catch (fehler) { meldung('Nicht zurückgesetzt: ' + fehler.message, true); }
}

/* ── Excel: Aufbau der Mappe ──────────────────────────────────────────────────
   Dieselben drei Blätter und dieselbe Spaltenfolge wie die Datei, die der
   tägliche Ablauf auf GitHub erzeugt (.github/scripts/excel_erzeugen.py). Beide
   müssen zusammenpassen: die vier Werkzeuge lesen nach Position, nicht nach
   Spaltenüberschrift. */
const PREIS_KOPF = ['Jahrgang', 'Titel', 'Auflage', 'Kategorie', 'Format',
  'Grundpreis / 4c-Preis (€)', '4c-Zuschlag (€)', 'rabattfähig', 'AE-fähig',
  'Termin (DU/EH)', 'Fachbereich', 'Seiten-Äquivalent'];
const PREIS_BREITE = [10, 40, 10.29, 30, 34, 25.14, 16.57, 13.14, 10.86, 16, 12.86, 17.43];
const TERMIN_KOPF = ['Jahrgang', 'Titel', 'Heft', 'Monat', 'ET', 'AS', 'DU-Schluss',
  'EH-Termin', 'Themenschwerpunkte', 'Kongresse'];
const TERMIN_BREITE = [10, 43.29, 6.86, 10.29, 10.14, 10.29, 13.14, 12.14, 122, 60.43];

function ensureExcelJS() {
  if (window.ExcelJS) return Promise.resolve();
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = 'https://cdn.jsdelivr.net/npm/exceljs@4.3.0/dist/exceljs.min.js';
    s.onload = res;
    s.onerror = () => rej(new Error('ExcelJS konnte nicht geladen werden (Internetverbindung?).'));
    document.head.appendChild(s);
  });
}

function zelleText(zelle) {
  const v = zelle ? zelle.value : null;
  if (v === null || v === undefined) return '';
  if (typeof v === 'object') {
    if (v instanceof Date) return ('0' + v.getDate()).slice(-2) + '.' + ('0' + (v.getMonth() + 1)).slice(-2) + '.' + String(v.getFullYear()).slice(-2);
    if ('result' in v) return String(v.result).trim();
    if ('text' in v) return String(v.text).trim();
    if ('richText' in v) return v.richText.map(t => t.text).join('').trim();
  }
  return String(v).trim();
}
function zelleZahl(zelle) {
  const t = zelleText(zelle).replace(/\s/g, '').replace(',', '.');
  if (t === '') return null;
  const n = Number(t);
  return isNaN(n) ? NaN : Math.round(n * 100) / 100;
}

/* ── Excel: Ausgang ───────────────────────────────────────────────────────────
   Ein Abzug des heutigen Standes zum Weiterarbeiten in Excel. Was hier
   herauskommt, lässt sich über „Aus Excel laden" wieder einlesen. */
/* Das Bauen der Mappe steht für sich, getrennt vom Herunterladen: nur so lässt
   sich nachmessen, ob die erzeugte Datei dieselben Zahlen ergibt wie die
   Datenbank. Geprüft wird genau das (siehe Änderungslog). */
async function excelMappeBauen() {
  await ensureExcelJS();
  const mappe = new ExcelJS.Workbook();
  {

    const info = mappe.addWorksheet('Info');
    info.getColumn(1).width = 82.71;
    [
      'Angebotsdaten – Abzug aus der Preispflege',
      '',
      'Dieser Abzug gibt den Stand der Datenbank zum Zeitpunkt des Sicherns wieder.',
      'Änderungen daran erreichen die Werkzeuge nicht von selbst — die Datei muss in',
      'der Preispflege über »Aus Excel laden« wieder eingelesen werden.',
      '',
      'Blatt »Preise« – eine Zeile je Format:',
      '   ' + PREIS_KOPF.join(' · '),
      'Blatt »Termine« – eine Zeile je Ausgabe:',
      '   ' + TERMIN_KOPF.join(' · '),
      '',
      'Spaltenreihenfolge NICHT ändern – gelesen wird nach Position.'
    ].forEach(z => info.addRow([z]));
    info.getRow(1).font = { bold: true };

    const preise = mappe.addWorksheet('Preise');
    preise.addRow(PREIS_KOPF).font = { bold: true };
    PREIS_BREITE.forEach((b, i) => { preise.getColumn(i + 1).width = b; });
    preise.views = [{ state: 'frozen', ySplit: 1 }];

    const termine = mappe.addWorksheet('Termine');
    termine.addRow(TERMIN_KOPF).font = { bold: true };
    TERMIN_BREITE.forEach((b, i) => { termine.getColumn(i + 1).width = b; });
    termine.views = [{ state: 'frozen', ySplit: 1 }];

    let nP = 0, nT = 0;
    (ARBEIT || []).forEach(t => {
      (t.preis || []).forEach(p => {
        preise.addRow([Number(t.jahr), t.name, Number(t.auflage) || 0, p.kategorie, p.format,
          p.preis == null ? null : Number(p.preis),
          p.zuschlag_4c == null ? null : Number(p.zuschlag_4c),
          p.rabattfaehig ? 'ja' : 'nein', p.ae_faehig ? 'ja' : 'nein',
          p.termin_art || null, t.fachbereich || null,
          p.seiten_aequivalent == null ? null : Number(p.seiten_aequivalent)]);
        nP++;
      });
      (t.termin || []).forEach(a => {
        termine.addRow([Number(t.jahr), t.name, a.heft, a.monat || null, a.et || null,
          a.anzeigenschluss || null, a.du_schluss || null, a.eh_termin || null,
          a.themen || null, a.kongresse || null]);
        nT++;
      });
    });
    preise.autoFilter = 'A1:L' + (nP + 1);
    termine.autoFilter = 'A1:J' + (nT + 1);
    return { mappe: mappe, preise: nP, termine: nT };
  }
}

async function excelSichern() {
  try {
    meldung('Datei wird erzeugt …');
    const { mappe, preise: nP, termine: nT } = await excelMappeBauen();
    const puffer = await mappe.xlsx.writeBuffer();
    const brocken = new Blob([puffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const heute = new Date(), z = n => String(n).padStart(2, '0');
    const a = Object.assign(document.createElement('a'), {
      href: URL.createObjectURL(brocken),
      download: 'Angebotsdaten_' + heute.getFullYear() + '-' + z(heute.getMonth() + 1) + '-' + z(heute.getDate()) + '.xlsx'
    });
    document.body.appendChild(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 100);
    meldung('Abzug gesichert — ' + nP + ' Preise, ' + nT + ' Termine.');
  } catch (fehler) {
    meldung('Nicht gesichert: ' + fehler.message, true);
  }
}

/* ── Excel: Eingang ───────────────────────────────────────────────────────────
   Jeder Jahrgang, der in der Datei vorkommt, wird in der Datenbank im Ganzen
   ersetzt. Nur so verschwinden gestrichene Formate und Ausgaben wirklich —
   zeilenweises Mischen ließe sie stehen. Jahrgänge, die nicht in der Datei
   stehen, bleiben unangetastet. Vor jedem entsteht ohne Zutun ein
   Sicherungspunkt. */
let excelStapel = null;

function excelEingangWaehlen() {
  if (offeneAenderungen() && !confirm('Es sind Änderungen offen, die noch nicht gespeichert sind.\n\nDer Excel-Eingang schreibt unmittelbar in die Datenbank. Offene Änderungen gehen dabei verloren.\n\nTrotzdem fortfahren?')) return;
  document.getElementById('excelDatei').click();
}

async function excelEingangGewaehlt(ereignis) {
  const datei = ereignis.target.files && ereignis.target.files[0];
  ereignis.target.value = '';
  if (!datei) return;
  try {
    meldung('Datei wird gelesen …');
    await ensureExcelJS();
    const mappe = new ExcelJS.Workbook();
    await mappe.xlsx.load(await datei.arrayBuffer());
    excelStapel = excelLesen(mappe, datei.name);
    excelBerichtZeigen();
  } catch (fehler) {
    meldung('Datei nicht gelesen: ' + fehler.message, true);
  }
}

function excelLesen(mappe, dateiname) {
  const bP = mappe.getWorksheet('Preise');
  if (!bP) throw new Error('In der Datei fehlt das Tabellenblatt „Preise".');
  const bT = mappe.getWorksheet('Termine');

  const jahre = {};
  const beanstandet = [];
  const gesehen = new Set();

  bP.eachRow((zeile, nr) => {
    if (nr === 1) return;
    const jahr = zelleText(zeile.getCell(1)), name = zelleText(zeile.getCell(2));
    const fmt = zelleText(zeile.getCell(5));
    if (!jahr || !name || !fmt) return;
    const kat = zelleText(zeile.getCell(4)) || 'Sonstige';
    const schl = jahr + '|' + name + '|' + kat + '|' + fmt;
    if (gesehen.has(schl)) { beanstandet.push('Zeile ' + nr + ': „' + fmt + '" steht bei ' + name + ' zweimal in derselben Kategorie'); return; }
    gesehen.add(schl);
    const preis = zelleZahl(zeile.getCell(6)), zuschlag = zelleZahl(zeile.getCell(7));
    const eq = zelleZahl(zeile.getCell(12));
    if (isNaN(preis)) beanstandet.push('Zeile ' + nr + ': Preis ist keine Zahl');
    if (isNaN(zuschlag)) beanstandet.push('Zeile ' + nr + ': 4c-Zuschlag ist keine Zahl');
    if (isNaN(eq) || (eq != null && eq <= 0)) beanstandet.push('Zeile ' + nr + ': Seiten-Äquivalent muss größer als 0 sein');
    const art = zelleText(zeile.getCell(10)).toUpperCase();
    if (art && art !== 'DU' && art !== 'EH') beanstandet.push('Zeile ' + nr + ': Termin muss DU, EH oder leer sein');

    if (!jahre[jahr]) jahre[jahr] = { titel: [], nachName: {} };
    let t = jahre[jahr].nachName[name];
    if (!t) {
      t = { name: name, auflage: parseInt(zelleText(zeile.getCell(3)).replace(/\D/g, ''), 10) || 0,
            fachbereich: zelleText(zeile.getCell(11)), preise: [], termine: [] };
      jahre[jahr].nachName[name] = t;
      jahre[jahr].titel.push(t);
    }
    if (!t.fachbereich) t.fachbereich = zelleText(zeile.getCell(11));
    t.preise.push({ reihenfolge: t.preise.length + 1, kategorie: kat, format: fmt,
      preis: isNaN(preis) ? null : preis, zuschlag_4c: isNaN(zuschlag) ? null : zuschlag,
      rabattfaehig: /^ja$/i.test(zelleText(zeile.getCell(8))),
      ae_faehig: /^ja$/i.test(zelleText(zeile.getCell(9))),
      termin_art: (art === 'DU' || art === 'EH') ? art : null,
      seiten_aequivalent: (isNaN(eq) || eq == null || eq <= 0) ? null : eq });
  });

  const ohneTitel = [];
  if (bT) bT.eachRow((zeile, nr) => {
    if (nr === 1) return;
    const jahr = zelleText(zeile.getCell(1)), name = zelleText(zeile.getCell(2));
    if (!jahr || !name) return;
    const heft = zelleText(zeile.getCell(3));
    if (!heft) { beanstandet.push('Termine, Zeile ' + nr + ': ohne Heftnummer'); return; }
    if (!jahre[jahr] || !jahre[jahr].nachName[name]) { ohneTitel.push(jahr + ' · ' + name); return; }
    const t = jahre[jahr].nachName[name];
    if (t.termine.some(a => a.heft === heft)) { beanstandet.push('Termine, Zeile ' + nr + ': Heft ' + heft + ' steht bei ' + name + ' zweimal'); return; }
    ['et', 'anzeigenschluss', 'du_schluss', 'eh_termin'].forEach((f, i) => {
      const w = zelleText(zeile.getCell(5 + i));
      if (!terminGueltig(w)) beanstandet.push('Termine, Zeile ' + nr + ': „' + w + '" ist kein Termin der Form TT.MM.');
    });
    t.termine.push({ reihenfolge: t.termine.length + 1, heft: heft,
      monat: zelleText(zeile.getCell(4)), et: zelleText(zeile.getCell(5)),
      anzeigenschluss: zelleText(zeile.getCell(6)), du_schluss: zelleText(zeile.getCell(7)),
      eh_termin: zelleText(zeile.getCell(8)), themen: zelleText(zeile.getCell(9)),
      kongresse: zelleText(zeile.getCell(10)) });
  });

  if (!Object.keys(jahre).length) throw new Error('In der Datei wurden keine Preiszeilen gefunden.');
  return { dateiname, jahre, beanstandet, ohneTitel: [...new Set(ohneTitel)] };
}

function excelBerichtZeigen() {
  const st = excelStapel;
  const jahre = Object.keys(st.jahre).sort();
  let zeilen = '';
  jahre.forEach(j => {
    const neu = st.jahre[j];
    const nP = neu.titel.reduce((s, t) => s + t.preise.length, 0);
    const nT = neu.titel.reduce((s, t) => s + t.termine.length, 0);
    const alt = (ARBEIT || []).filter(t => t.jahr === j);
    const aP = alt.reduce((s, t) => s + (t.preis || []).length, 0);
    const aT = alt.reduce((s, t) => s + (t.termin || []).length, 0);
    const pfeil = (a, b) => a === b ? String(b) : (a + ' → <b>' + b + '</b>');
    zeilen += '<div class="dialog-zeile"><span>Jahrgang ' + esc(j) + '</span><span style="color:var(--text)">' +
      pfeil(alt.length, neu.titel.length) + ' Titel · ' + pfeil(aP, nP) + ' Preise · ' + pfeil(aT, nT) + ' Termine</span></div>';
  });
  const unberuehrt = jahrgaenge().filter(j => jahre.indexOf(j) < 0);
  const schlimm = st.beanstandet.length > 0;

  dialogZeigen(
    '<h3>Aus Excel laden</h3>' +
    '<div class="erklaerung">' + esc(st.dateiname) + '</div>' +
    zeilen +
    (unberuehrt.length ? '<div class="dialog-zeile"><span>Nicht in der Datei</span><span style="color:var(--grey-600)">Jahrgang ' + unberuehrt.map(esc).join(', ') + ' bleibt unangetastet</span></div>' : '') +
    (st.ohneTitel.length ? '<div class="dialog-zeile"><span>Termine ohne Titel</span><span style="color:var(--orange-dark)">' + st.ohneTitel.slice(0, 3).map(esc).join(' · ') + (st.ohneTitel.length > 3 ? ' …' : '') + ' — übergangen</span></div>' : '') +
    '<div class="dialog-summe">' +
      (schlimm
        ? '<b>' + st.beanstandet.length + ' Beanstandungen.</b> Es wird nichts übernommen.<br>' +
          st.beanstandet.slice(0, 5).map(esc).join('<br>') + (st.beanstandet.length > 5 ? '<br>…' : '')
        : 'Die aufgeführten Jahrgänge werden <b>im Ganzen ersetzt</b> — auch alles, was seit dem Abzug in der Preispflege geändert wurde. Vor jedem entsteht ohne Zutun ein Sicherungspunkt.') +
    '</div>' +
    '<div class="dialog-knoepfe">' +
      '<button class="btn" onclick="dialogSchliessen()">Abbrechen</button>' +
      (schlimm ? '' : '<button class="btn btn-primär" id="exKnopf" onclick="excelUebernehmen()">Übernehmen</button>') +
    '</div>');
}

async function excelUebernehmen() {
  const st = excelStapel;
  if (!st) return;
  const knopf = document.getElementById('exKnopf');
  knopf.disabled = true; knopf.textContent = 'Wird übernommen …';
  try {
    if (sitzung && sitzung.ablauf && sitzung.ablauf < Date.now() + 60000) await sitzungErneuern();
    const jahre = Object.keys(st.jahre).sort();
    let nP = 0, nT = 0;
    for (const jahr of jahre) {
      const vorhanden = (ARBEIT || []).some(t => t.jahr === jahr);
      if (vorhanden) await sicherungAnlegen(jahr, 'vor dem Einlesen von ' + st.dateiname, true);
      else await schreiben('jahrgang', 'POST', { jahr: jahr });

      if (vorhanden) await schreiben('titel?jahr=eq.' + encodeURIComponent(jahr), 'DELETE');

      let rf = 0;
      for (const t of st.jahre[jahr].titel) {
        rf++;
        const angelegt = await schreiben('titel', 'POST',
          { jahr: jahr, reihenfolge: rf, name: t.name, auflage: t.auflage, fachbereich: t.fachbereich });
        const tid = angelegt[0].id;
        for (let i = 0; i < t.preise.length; i += 250) {
          const teil = t.preise.slice(i, i + 250).map(p => Object.assign({ titel_id: tid }, p));
          await schreiben('preis', 'POST', teil, teil.length);
          nP += teil.length;
        }
        if (t.termine.length) {
          const teil = t.termine.map(a => Object.assign({ titel_id: tid }, a));
          await schreiben('termin', 'POST', teil, teil.length);
          nT += teil.length;
        }
      }
    }
    dialogSchliessen();
    excelStapel = null;
    await ladenAusDatenbank();
    if (!titelVonId(gewTitel)) { const e = titelDesJahres()[0]; gewTitel = e ? e.id : null; }
    jahrAuswahlAufbauen();
    zeichnen();
    meldung('Übernommen — ' + nP + ' Preise und ' + nT + ' Termine aus ' + st.dateiname + '.');
  } catch (fehler) {
    meldung('Nicht übernommen: ' + fehler.message + ' — der Sicherungspunkt steht.', true);
    if (knopf) { knopf.disabled = false; knopf.textContent = 'Übernehmen'; }
  }
}

/* ── Start ────────────────────────────────────────────────────────────────── */
sitzungLesen();
if (sitzung) starten(); else anmeldeSchirmZeigen();
</script>
